<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://ettopqmqnjzktdfygtuz.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>비밀번호 재설정 · 엠솔루션 QMS</title>
<style>
:root{--ink:#0F172A;--paper:#EDF1F6;--sheet:#fff;--rule:#D5DCE6;--muted:#5B6B80;--blue:#1D4ED8;--orange:#E2580B;--ok:#157F3B;--ng:#B42318;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.55 "Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--paper);
background-image:linear-gradient(#DCE3EC 1px,transparent 1px),linear-gradient(90deg,#DCE3EC 1px,transparent 1px);background-size:16px 16px}
header{background:var(--ink);color:#fff;border-bottom:3px solid var(--orange);padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));font-weight:700}
main{max-width:440px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
h2{font-size:17px;margin:0;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.step{color:var(--orange);font-weight:700;margin-right:6px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
input,textarea{font:inherit;font-size:16px;color:var(--ink);border:1px solid #B9C4D2;border-radius:4px;padding:11px 12px;width:100%;min-height:48px}
textarea{min-height:90px;font-size:13px}
input:focus,textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.btn{font:inherit;font-weight:600;border:0;border-radius:4px;padding:12px 18px;min-height:48px;background:var(--blue);color:#fff}
.btn:disabled{opacity:.5}
.msg{padding:10px 12px;font-size:14px;border-left:4px solid;border-radius:3px}
.ok{background:#E3F4E8;border-color:var(--ok);color:#0F4D25}.err{background:#FCE8E6;border-color:var(--ng);color:#7A1A12}.info{background:#E3EBFB;border-color:var(--blue);color:#1E3A8A}
ol{margin:0;padding-left:20px;font-size:14px}
a{color:var(--blue)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>(주)엠솔루션 · 비밀번호 재설정</header>
<main>
<section class="panel" id="s1">
  <h2><span class="step">1</span>재설정 메일 받기</h2>
  <label>로그인 이메일<input id="em" type="email" autocomplete="username" autocapitalize="none"></label>
  <button class="btn" id="b1" type="button">재설정 메일 보내기</button>
  <div id="m1"></div>
</section>
<section class="panel" id="s2">
  <h2><span class="step">2</span>메일 속 링크 누르기</h2>
  <ol>
    <li>받은 메일에서 <b>Reset Password</b>를 누르면 이 화면으로 돌아와 <b>3단계</b>가 열립니다</li>
    <li>3단계가 안 열리면: 링크를 <b>길게 눌러 복사</b> → 아래 칸에 붙여넣기</li>
  </ol>
  <label>복사한 링크<textarea id="lk" spellcheck="false" placeholder="https://ettopqmqnjzktdfygtuz.supabase.co/auth/v1/verify?token=..."></textarea></label>
  <button class="btn" id="b2" type="button">링크 확인</button>
  <div id="m2"></div>
</section>
<section class="panel" id="s3" hidden>
  <h2><span class="step">3</span>새 비밀번호 정하기</h2>
  <label>새 비밀번호 (8자 이상)<input id="p1" type="password" autocomplete="new-password"></label>
  <label>한 번 더<input id="p2" type="password" autocomplete="new-password"></label>
  <button class="btn" id="b3" type="button">비밀번호 변경</button>
  <div id="m3"></div>
</section>
<p style="font-size:13px"><a href="./">← 로그인 화면으로</a></p>
</main>
<script>
"use strict";
const SB_URL="https://ettopqmqnjzktdfygtuz.supabase.co", SB_KEY="sb_publishable_2XOscbG2JvfZyCGKiwyj9g_8_4k5G-P";
const $=s=>document.querySelector(s);
const say=(el,cls,t)=>{el.innerHTML=t?`<div class="msg ${cls}"></div>`:"";if(t)el.firstChild.textContent=t;};
let sess=null;
async function call(path,method,body,token){
  const r=await fetch(SB_URL+path,{method,headers:{apikey:SB_KEY,"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.msg||j.error_description||j.message||("오류 "+r.status));
  return j;
}
function keep(j){
  sess={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600)};
  $("#s3").hidden=false; $("#p1").focus();
}
$("#b1").onclick=async()=>{
  const e=$("#em").value.trim(); if(!e.includes("@")) return say($("#m1"),"err","이메일을 입력하세요");
  $("#b1").disabled=true;
  try{ await call("/auth/v1/recover","POST",{email:e}); say($("#m1"),"ok","메일을 보냈습니다. 받은편지함(없으면 스팸함)을 확인하세요."); }
  catch(err){ say($("#m1"),"err",/rate limit/i.test(err.message)?"메일 발송 한도(시간당 횟수)를 넘었습니다. 1시간 뒤 다시 누르세요. 이미 받은 최신 메일이 있으면 그 링크를 쓰세요.":"보내기 실패: "+err.message+" (잠시 후 다시 시도)"); }
  $("#b1").disabled=false;
};
$("#b2").onclick=async()=>{
  let u; try{ u=new URL($("#lk").value.trim()); }catch(e){ return say($("#m2"),"err","링크 전체를 붙여넣으세요"); }
  const tok=u.searchParams.get("token"), type=u.searchParams.get("type");
  if(!tok||type!=="recovery") return say($("#m2"),"err","비밀번호 재설정 메일의 링크가 아닙니다");
  $("#b2").disabled=true;
  try{ keep(await call("/auth/v1/verify","POST",{type:"recovery",token_hash:tok})); say($("#m2"),"ok","확인되었습니다. 새 비밀번호를 정하세요."); }
  catch(err){ say($("#m2"),"err","링크 확인 실패: "+err.message+" — 링크는 한 번만, 1시간 안에 쓸 수 있습니다. 1단계부터 다시 하세요."); $("#b2").disabled=false; }
};
$("#b3").onclick=async()=>{
  const a=$("#p1").value,b=$("#p2").value;
  if(a.length<8) return say($("#m3"),"err","8자 이상 입력하세요");
  if(a!==b) return say($("#m3"),"err","두 칸이 서로 다릅니다");
  $("#b3").disabled=true;
  try{
    await call("/auth/v1/user","PUT",{password:a},sess.access_token);
    try{ localStorage.setItem("qms_session",JSON.stringify(sess)); }catch(e){}
    say($("#m3"),"ok","변경 완료. 잠시 후 QMS로 이동합니다.");
    setTimeout(()=>location.href="./",1500);
  }catch(err){ say($("#m3"),"err","변경 실패: "+err.message); $("#b3").disabled=false; }
};
// 메일 링크를 그대로 눌러 이 페이지로 돌아온 경우(#access_token...&type=recovery)
(()=>{ const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("type")==="recovery"&&h.get("access_token")){ keep({access_token:h.get("access_token"),refresh_token:h.get("refresh_token"),expires_in:+h.get("expires_in")||3600}); history.replaceState(null,"",location.pathname); say($("#m2"),"ok","메일 링크가 확인되었습니다. 새 비밀번호를 정하세요."); }
})();
</script>
</body>
</html>
