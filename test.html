:root{
  --ink:#0F172A; --ink2:#1E293B; --paper:#EDF1F6; --sheet:#FFFFFF; --rule:#D5DCE6; --grid:#DCE3EC; --grid2:#C9D3DF;

  --ok:#157F3B; --ok-soft:#E3F4E8; --ng:#B42318; --ng-soft:#FCE8E6; --wait:#9A5B00; --wait-soft:#FDF1DC; --test:#4338CA; --test-soft:#E8E7FB;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{position:relative;isolation:isolate;min-height:100vh;font:15px/1.55 var(--sans);color:var(--fg);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,16px 16px,16px 16px;background-attachment:fixed}

body.is-login::after{opacity:.32}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:3px solid var(--orange);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.hbar{max-width:960px;margin:0 auto;display:flex;align-items:stretch;gap:12px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:#93A3B8}
.tblock{display:grid;grid-template-columns:auto auto;border:1px solid #334155;font-size:11.5px;line-height:1.3}
.tblock div{padding:4px 8px;border-bottom:1px solid #334155}
.tblock div:nth-child(odd){color:#93A3B8;border-right:1px solid #334155}
.tblock div:nth-last-child(-n+2){border-bottom:0}
.tblock div:nth-child(even){font-weight:600}
#btnLogout{align-self:center;background:transparent;color:#CBD5E1;border:1px solid #475569;border-radius:4px;padding:8px 10px;font:inherit;font-size:12.5px;min-height:40px}
main{max-width:960px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.panel{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:0 1px 0 rgba(15,23,42,.04)}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.phead small{color:var(--muted);font-size:12.5px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:#fff;border:1px solid #B9C4D2;border-radius:4px;padding:11px 12px;width:100%;min-width:0;min-height:48px}
input[readonly]{background:#F3F6F9;color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}

textarea{min-height:72px;resize:vertical}

.btn.primary{background:var(--blue)}
.btn.accent{background:var(--orange)}
.btn.ghost{background:#E7ECF2;color:var(--fg)}
.btn:active{transform:translateY(1px)}

.btns{display:flex;gap:8px;flex-wrap:wrap}
.msg{border-radius:3px;padding:10px 12px;font-size:14px;border-left:4px solid}
.msg.ok{background:var(--ok-soft);color:#0F4D25;border-color:var(--ok)}
.msg.err{background:var(--ng-soft);color:#7A1A12;border-color:var(--ng)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);display:flex;justify-content:center;gap:2px;
  padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));overflow-x:auto}
nav.tabs button{flex:1 1 0;max-width:120px;min-width:58px;background:transparent;border:0;color:#8C9BB0;font:inherit;font-size:11.5px;font-weight:600;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:#fff;border-top-color:var(--orange)}
.results{border:1px solid var(--rule);border-radius:3px;max-height:300px;overflow:auto;background:#fff}
.results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:#fff;padding:11px 12px;font:inherit;font-size:14px;cursor:pointer;min-height:52px}
.results button:hover{background:#F3F6F9}
.code{font-family:var(--mono);font-size:13px;letter-spacing:-.01em}
.sel{background:var(--blue-soft);border:1px solid #C7D5F5;border-radius:3px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.defects{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.def{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--rule);border-radius:3px;padding:4px 4px 4px 10px;font-size:13px;background:#FAFBFC}
.def input{width:66px;min-height:40px;padding:6px;text-align:right;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;border:1px solid var(--rule);background:var(--sheet)}
.kpi{padding:12px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kpi .k{font-size:12.5px;color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{background:var(--ink2);color:#fff;font-weight:600;text-align:left;padding:9px 10px;white-space:nowrap;font-size:13px}
td{padding:9px 10px;border-top:1px solid var(--rule);white-space:nowrap}
tbody tr:nth-child(even):not(.total) td{background:#FAFBFD}
td.n,th.n{text-align:right}
tr.total td{background:#E4E9F0!important;font-weight:700;border-top:2px solid var(--ink2)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--blue-soft)!important}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:3px;padding:2px 7px;border:1px solid transparent}

.muted{color:var(--muted);font-size:13px}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--fg);min-height:44px}
.check input{width:22px;height:22px;min-height:0}

function downloadCsv(name, head, rows){
  const c = v => { const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  const blob = new Blob(["﻿"+[head,...rows].map(r=>r.map(c).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
}

function barChart(s){
  const W=640, rowH=30, padL=120, padR=70, H=s.length*rowH+10, max=Math.max(...s.map(x=>x.ppm||0),1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="업체별 PPM">${s.map((x,i)=>{ const w=((x.ppm||0)/max)*(W-padL-padR), y=i*rowH+5;
    return `<text x="${padL-8}" y="${y+18}" text-anchor="end" font-size="13" fill="#334155">${esc(x.supplier).slice(0,12)}</text>
    <rect x="${padL}" y="${y+4}" width="${Math.max(w,1)}" height="20" rx="3" fill="${i===0&&x.reject>0?"#EA580C":"#2563EB"}"></rect>
    <text x="${padL+Math.max(w,1)+6}" y="${y+18}" font-size="12" fill="#0F172A">${n1(x.ppm)}</text>`; }).join("")}</svg>`;
}

/* ---------- 사진: 자동 축소 · 업로드 · 열람 ---------- */
const BUCKET = "quality-evidence";
function shrinkImage(file, maxSide=1600, quality=0.8){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxSide/Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("사진 변환 실패")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`이 사진 형식은 열 수 없습니다 (${file.name}). 카메라 설정을 '호환성 우선'으로 하거나 다시 촬영하세요.`)); };
    img.src = url;
  });
}
async function uploadPhoto(path, blob, type="image/jpeg"){
  const r = await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`, {method:"POST", headers:{apikey:SB_KEY, Authorization:`Bearer ${await token()}`, "Content-Type":type, "x-upsert":"false"}, body:blob});
  if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.message || `업로드 오류 ${r.status}`); }
}
const photoCache = {};
// 로그인 토큰으로 직접 내려받아 화면에 표시 (서버 주소를 이미지에 직접 넣으면 일부 브라우저가 차단함)
async function signedUrl(path){
  if(photoCache[path]) return photoCache[path];
  const r = await fetch(`${SB_URL}/storage/v1/object/authenticated/${BUCKET}/${path}`, {headers:{apikey:SB_KEY, Authorization:`Bearer ${await token()}`}});
  if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.message || "열람 권한 없음"); }
  const url = URL.createObjectURL(await r.blob()); photoCache[path] = url; return url;
}
function lightbox(src){ const d=document.createElement("div"); d.id="lightbox"; d.innerHTML=`<img src="${esc(src)}" alt="증빙사진">`; d.onclick=()=>d.remove(); document.body.appendChild(d); }
async function fillPhotos(host){
  for(const img of host.querySelectorAll("img[data-path]")){
    try{ img.src = await signedUrl(img.dataset.path); img.onclick=()=>lightbox(img.src); }
    catch(e){ img.replaceWith(Object.assign(document.createElement("div"),{className:"muted",style:"padding:6px;font-size:12px",textContent:"열람 불가"})); }
  }
  for(const au of host.querySelectorAll("audio[data-path]")){
    try{ au.src = await signedUrl(au.dataset.path); }catch(e){ au.replaceWith(Object.assign(document.createElement("div"),{className:"muted",textContent:"음성 열람 불가"})); }
  }
}
const nowLocal = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
const fmtDT = v => new Date(v).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
const AUDIO_EXT = {"audio/webm":"webm","audio/mp4":"m4a","audio/aac":"aac","audio/ogg":"ogg","audio/mpeg":"mp3","audio/x-m4a":"m4a"};
function mediaHtml(r){
  const media = r.media && r.media.length ? r.media : (r.photos||[]).map(p=>({path:p,mime:"image/jpeg"}));
  const imgs = media.filter(m=>!String(m.mime||"").startsWith("audio")), auds = media.filter(m=>String(m.mime||"").startsWith("audio"));
  return (imgs.length?`<div class="thumbs">${imgs.map((m,i)=>`<div class="t"><img data-path="${esc(m.path)}" alt="증빙 ${i+1}"></div>`).join("")}</div>`:"")
    + auds.map(m=>`<div style="margin-top:6px"><span class="muted">🎤 음성</span><audio controls preload="none" data-path="${esc(m.path)}" style="width:100%;height:40px"></audio></div>`).join("")
    + (!media.length?`<div class="muted">첨부 없음</div>`:"");
}

/* ---------- 업체통보: 규칙 기반 초안 (외부 AI 미사용) ---------- */
const NOTICE_DEFECTS = ["가스","융착불량","터치업","스크류 누락","누락","돌출량","긁힘","찍힘","스크래치","이종","미성형","컬러이색","변형","오염","조립불량","기타"];
const DEFAULT_REQUEST = "- 순성 사내재고 수정 및 선별 요청 드립니다.\n순성공장내 재고부터 대응 부탁드리며 시간 공유 부탁드립니다.";
// 조치로 분류: 명확한 조치 단어가 있거나 '~중'으로 끝나는 문장. 그 외는 문제점.
const ACTION_RE = /(격리|선별|교체|재작업|반송|폐기|보류|사용중지|조치|수정\s*$|수정중|수정\s*완료|진행중|대응중|대기중|비가동중|\S+중\s*$)/;
const VEH_RE = /\b(KA4|CE1|CT1|SV1|GN7|SP3K|CV1|MV1|GL3)\b/i;
const pad2 = n => String(n).padStart(2,"0");
const hm = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
function applyRules(text, rules){
  let t = text; (rules||[]).filter(r=>r.active).forEach(r=>{ t = t.split(r.from).join(r.to); }); return t;
}
function buildNoticeDraft(o){
  // o: {line, memo, qty, defect, repeat, occurred(Date), dtStart(Date|null), dtEnd(Date|null), request, rules}
  const memo = applyRules(String(o.memo||"").trim(), o.rules);
  const segs = memo.split(/\n|[.。]\s|,|\s\/\s|·/).map(s=>s.replace(/^[-•\s]+/,"").trim()).filter(Boolean);
  const problem = segs.filter(s=>!ACTION_RE.test(s)), action = segs.filter(s=>ACTION_RE.test(s));
  const parts = String(o.line||"").split(" "); const lineVeh = (parts[0]||"").split("/")[0]; const item = parts.slice(1).join(" ");
  const vm = memo.match(VEH_RE); const veh = vm ? vm[1].toUpperCase().replace("SP3K","SP3k") : lineVeh;
  const d = o.occurred || new Date();
  const out = [`${veh}${item?" "+item:""} (${d.getMonth()+1}월${d.getDate()}일)`, "", "1. 문제점 :"];
  (problem.length ? problem : [o.defect||"불량 발생"]).forEach(s=>out.push("- "+s));
  out.push(`- 불량수량 ${Number(o.qty||0).toLocaleString("ko-KR")}EA${o.repeat>=2?` (금월 동일유형 ${o.repeat}회째)`:""}`);
  out.push("");
  let act = action.join(", ") || "해당 불량 격리";
  if(o.dtStart && o.dtEnd){ const m = Math.max(0, Math.round((o.dtEnd-o.dtStart)/60000)); act += ` (라인 비가동 ${hm(o.dtStart)}~${hm(o.dtEnd)} 총 ${m}분)`; }
  else if(o.dtStart){ act += ` (라인 비가동 ${hm(o.dtStart)}~ 진행중)`; }
  out.push("2. 조치사항 : "+act, "", "3. 요청사항 :", o.request || DEFAULT_REQUEST);
  return out.join("\n");
}
// 사람이 고친 단어 치환 추출 (학습 기록용)
function wordEdits(a, b){
  const A=a.split(/\s+/).filter(Boolean), B=b.split(/\s+/).filter(Boolean); if(A.length*B.length>90000) return [];
  const L=Array.from({length:A.length+1},()=>new Int16Array(B.length+1));
  for(let i=A.length-1;i>=0;i--) for(let j=B.length-1;j>=0;j--) L[i][j]= A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  // 1) 같음/삭제/추가 단위 작업열
  const ops=[]; let i=0,j=0;
  while(i<A.length||j<B.length){
    if(i<A.length&&j<B.length&&A[i]===B[j]){ ops.push(["=",A[i],B[j]]); i++; j++; }
    else if(j<B.length&&(i>=A.length||L[i][j+1]>=L[i+1][j])){ ops.push(["+",null,B[j++]]); }
    else { ops.push(["-",A[i++],null]); }
  }
  // 2) 같은 단어 1개 이하를 사이에 둔 변경은 한 구절로 묶음 (예: "LBAN 케이스" → "CASE LBAN 사양")
  const edits=[]; let k=0;
  while(k<ops.length){
    if(ops[k][0]==="="){ k++; continue; }
    let s=k, e=k;
    while(e+1<ops.length && (ops[e+1][0]!=="=" || (e+2<ops.length && ops[e+2][0]!=="=" && ops[e+1][0]==="="))) e++;
    // 앞쪽 같은 단어 1개를 문맥으로 포함 (순수 추가만 있는 경우 위치를 잡기 위해)
    let grp=ops.slice(s,e+1); const onlyIns=grp.every(o=>o[0]!=="-");
    if(onlyIns && s>0 && ops[s-1][0]==="=") grp=[ops[s-1],...grp];
    if(onlyIns && e+1<ops.length && ops[e+1][0]==="=") grp=[...grp,ops[e+1]];
    const f=grp.filter(o=>o[1]!=null).map(o=>o[1]).join(" "), t=grp.filter(o=>o[2]!=null).map(o=>o[2]).join(" ");
    const nA=grp.filter(o=>o[1]!=null).length, nB=grp.filter(o=>o[2]!=null).length;
    if(f && f!==t && nA<=5 && nB<=6 && f.length<=80 && t.length<=80 && !/\d{2,}/.test(f)) edits.push({from:f,to:t});
    k=e+1;
  }
  return edits.slice(0,50);
}

/* ---------- 업체통보 작성 (휴대폰) ---------- */
function viewNotice(pre){
  let line=null, supplier=null, defect=null, rules=[], drafted="", lastDraftKey="";

    <label>업체 (필수 · 라인 차종 업체가 위에 나옵니다)<select id="ns"><option value="">라인을 먼저 선택</option></select></label>
    <div><div class="muted" style="margin-bottom:6px">불량유형 (필수)</div><div class="chips" id="nd">${NOTICE_DEFECTS.map(d=>`<button type="button" data-v="${esc(d)}">${esc(d)}</button>`).join("")}</div></div>
    <div class="row"><label>불량수량 (EA, 필수)<input type="number" inputmode="numeric" min="1" id="nq"></label><label>발생시각<input type="datetime-local" id="no" value="${nowLocal()}"></label></div>
    <label class="check"><input type="checkbox" id="ndt"> 라인 비가동 발생</label>
    <div class="row" id="ndtr" hidden><label>비가동 시작<input type="time" id="nds"></label><label>비가동 종료 (진행중이면 비움)<input type="time" id="nde"></label></div>

      <div><div class="muted" style="margin:8px 0 6px">사진 (최대 4장 · 자동 축소)</div><div class="thumbs" id="np"></div><input type="file" id="nf" accept="image/*" multiple hidden></div>
      <label class="check"><input type="checkbox" id="ntest"> 시험용 기록</label>
      <button class="btn primary" id="nsave">저장</button>
    </div></form>
    <section class="panel" id="nshare" hidden></section>`;
  rpc("qms_text_rules").then(r=>rules=r).catch(()=>{});
  const pick=(box,v)=>box.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  const loadSup = async () => {
    const veh=(line||"").split(" ")[0].split("/")[0];
    try{ const list=await rpc("qms_supplier_options",{p_vehicle:veh}); const last=ls("qms_notice_sup_"+line);
      $("#ns").innerHTML = `<option value="">선택</option>`+list.map(s=>`<option ${s===last?"selected":""}>${esc(s)}</option>`).join("");

      $("#ns").value = want || ""; supplier = $("#ns").value || null; refreshRepeat();
    }catch(e){ msg($("#nm"),"err",e.message); }
  };
  $("#nl").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; line=b.dataset.v; pick($("#nl"),line); ls("qms_last_line",line); loadSup(); };
  $("#nd").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; defect=b.dataset.v; pick($("#nd"),defect); refreshRepeat(); };
  $("#ns").onchange=()=>{ supplier=$("#ns").value||null; refreshRepeat(); };
  $("#ndt").onchange=()=>{ $("#ndtr").hidden=!$("#ndt").checked; if($("#ndt").checked&&!$("#nds").value){ $("#nds").value=hm(new Date()); } };
  let repeat=1;
  async function refreshRepeat(){
    if(!supplier||!defect){ $("#nrep").innerHTML=""; repeat=1; return; }
    try{ repeat = await rpc("qms_notice_repeat",{p_supplier:supplier,p_defect_type:defect,p_at:new Date($("#no").value).toISOString()});
      $("#nrep").innerHTML = repeat>=3 ? `<div class="flag8d">⚠ ${esc(supplier)} · ${esc(defect)} 이번 달 ${repeat}회째 — 대책서(8D) 요구 대상입니다</div>`
        : repeat===2 ? `<div class="msg info">${esc(supplier)} · ${esc(defect)} 이번 달 2회째</div>` : "";
    }catch(e){ repeat=1; }
  }
  const lst = pre?.line || ls("qms_last_line"); if(lst && LINES.includes(lst)){ line=lst; pick($("#nl"),line); loadSup(); }
  if(pre){ defect=pre.defect; pick($("#nd"),defect); $("#nq").value=pre.qty; $("#nmemo").value=pre.memo; }
  const toDate = t => { if(!t) return null; const base=new Date($("#no").value); const [h,m]=t.split(":").map(Number); base.setHours(h,m,0,0); return base; };
  $("#nbuild").onclick = () => {
    const q=parseInt($("#nq").value), errs=[];
    if(!line) errs.push("라인"); if(!supplier) errs.push("업체"); if(!defect) errs.push("불량유형"); if(!(q>0)) errs.push("불량수량");
    if($("#nmemo").value.trim().length<2) errs.push("메모");
    if(errs.length) return msg($("#nm"),"err",errs.join(", ")+"을(를) 입력하세요");
    msg($("#nm"),"","");
    if($("#nfinal").value && $("#nfinal").value!==drafted && !confirm("고친 통보문을 새 초안으로 바꿀까요?")) return;
    drafted = buildNoticeDraft({line, memo:$("#nmemo").value, qty:q, defect, repeat, occurred:new Date($("#no").value),

    $("#nfinal").value=drafted; $("#nedit").hidden=false; $("#nfinal").focus();
  };
  const drawThumbs=()=>{ $("#np").innerHTML = photos.map((p,i)=>`<div class="t"><img src="${p.url}" alt="사진 ${i+1}"><button type="button" data-i="${i}" aria-label="삭제">×</button></div>`).join("")
      + (photos.length<4?`<label class="addph" for="nf">+ 사진<br>${photos.length}/4</label>`:""); };
  $("#np").onclick=e=>{ const b=e.target.closest("button[data-i]"); if(!b) return; const [p]=photos.splice(+b.dataset.i,1); URL.revokeObjectURL(p.url); drawThumbs(); };
  $("#nf").onchange=async e=>{ const fs=[...e.target.files].slice(0,4-photos.length); e.target.value="";
    for(const f of fs){ try{ const blob=await shrinkImage(f); photos.push({blob,url:URL.createObjectURL(blob)}); }catch(err){ msg($("#nm"),"err",err.message); } } drawThumbs(); };
  drawThumbs();
  $("#fN").onsubmit = async e => {
    e.preventDefault(); const fin=$("#nfinal").value.trim(); if(fin.length<5) return msg($("#nm"),"err","통보문이 비어 있습니다");
    if(!confirm(`${supplier} · ${defect} ${$("#nq").value}EA\n사진 ${photos.length}장\n\n저장할까요? (저장 후 카톡으로 보냅니다)`)) return;
    const b=$("#nsave"); b.disabled=true; b.textContent="저장 중…"; let id=null;
    try{
      const ds=$("#ndt").checked?toDate($("#nds").value):null, de=$("#ndt").checked?toDate($("#nde").value):null;
      const r = await rpc("qms_notice_create",{p:{line_name:line,supplier,defect_type:defect,defect_qty:$("#nq").value,occurred_at:new Date($("#no").value).toISOString(),
        downtime_start:ds?ds.toISOString():"",downtime_end:de?de.toISOString():"",raw_memo:$("#nmemo").value.trim(),draft_text:drafted,final_text:fin,
        edits:wordEdits(drafted,fin),record_kind:$("#ntest").checked?"TEST":"NORMAL",promote_ids:pre?pre.ids:undefined}});
      id=r.id; const paths=[];
      for(let i=0;i<photos.length;i++){ b.textContent=`사진 올리는 중 ${i+1}/${photos.length}`; const path=`${r.uid}/sn/${id}/${Date.now()}_${i+1}.jpg`; await uploadPhoto(path,photos[i].blob); paths.push(path); }
      if(paths.length) await rpc("qms_notice_attach",{p_id:id,p_paths:paths});
      ls("qms_notice_sup_"+line, supplier); ls("qms_notice_req", $("#nreq").value.trim());
      showShare(id, fin, photos.map((p,i)=>new File([p.blob],`통보_${id}_${i+1}.jpg`,{type:"image/jpeg"})));
    }catch(err){ msg($("#nm"),"err", id?`통보 #${id}는 저장됐지만 사진 저장 실패: ${err.message}`:"저장 실패: "+err.message); b.disabled=false; b.textContent="저장"; }
  };
  function showShare(id, text, files){
    $("#fN").hidden=true; const s=$("#nshare"); s.hidden=false; window.scrollTo(0,0);
    const canFiles = files.length && navigator.canShare && navigator.canShare({files});
    s.innerHTML = `<h2>저장 완료 #${id} — 카톡으로 보내기</h2><div id="shm"></div>
      <div class="msg info">카톡 방을 고른 뒤 @멘션을 붙여 보내세요. 사진과 글이 같이 안 넘어가면 ② ③을 차례로 누르세요.</div>
      <div class="sharebar">
        ${canFiles||navigator.share?`<button class="btn primary" id="sh1">① 카톡으로 보내기 (사진+글)</button>`:""}
        ${canFiles?`<button class="btn" id="sh2">② 사진만 보내기 (${files.length}장)</button>`:""}
        <button class="btn" id="sh3">③ 글 복사</button>
        <button class="btn ghost" id="sh4">카톡 전송 완료 표시</button>
        <button class="btn ghost" id="sh5">새 통보 작성</button></div>
      <textarea class="notice-text" readonly style="margin-top:10px">${esc(text)}</textarea>`;
    const done = async () => { try{ await rpc("qms_notice_update",{p_id:id,p:{mark_sent:true}}); msg($("#shm"),"ok",`#${id} 발송 기록됨`); }catch(e){ msg($("#shm"),"err",e.message); } };
    const share = async data => { try{ await navigator.share(data); await done(); }catch(e){ if(e.name!=="AbortError") msg($("#shm"),"err","공유 실패: "+e.message+" — ② ③ 버튼을 쓰세요"); } };
    if($("#sh1")) $("#sh1").onclick=()=>share(canFiles?{files,text}:{text});
    if($("#sh2")) $("#sh2").onclick=()=>share({files});
    $("#sh3").onclick=async()=>{ try{ await navigator.clipboard.writeText(text); msg($("#shm"),"ok","복사됨 — 카톡 입력창을 길게 눌러 붙여넣으세요"); }
      catch(e){ const t=$("#nshare textarea"); t.removeAttribute("readonly"); t.select(); document.execCommand("copy"); msg($("#shm"),"ok","복사됨"); } };
    $("#sh4").onclick=done; $("#sh5").onclick=()=>viewNotice();
  }
}

/* ---------- SP3k PAB 심라인 증빙사진 (장기 보관) ---------- */
// 판정: 위·아래 도어판 틈이 뒷면 밀링 홈 폭 안이면 OK, 벗어나면 NG (안전 직결)
const PAB_GUIDE_KEY = {좌:"pab_left", 우:"pab_right"};
// 가이드 위치(화면 비율 %). 검증 대상은 도어판 틈 ↔ 밀링 홈 하나(10-28 대표). 좌=세로 끝단 근접, 우=90도 회전 끝단 근접. 라벨·바코드 안 씀
const PAB_LAYOUT = {
  좌:{line:50, band:3.5, label:null, hint:"휴대폰 세로 · 왼쪽 끝단을 가까이 · 빨간선에 도어판 틈"},
  우:{line:50, band:3.5, label:null, hint:"휴대폰 90도 회전(가로) · 빨간선에 도어판 틈"}
};
const myUid = () => { try{ const b=session.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"); return JSON.parse(decodeURIComponent(escape(atob(b + "===".slice((b.length+3)%4))))).sub; }catch(e){ return ""; } };
const pabShiftNow = () => { const h=new Date().getHours(); return (h>=8 && h<20) ? "주간" : "야간"; };
function pabOverlaySvg(side){
  const L=PAB_LAYOUT[side];
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
    <rect x="0" y="${L.line-L.band}" width="100" height="${L.band*2}" fill="rgba(34,197,94,.18)"/>
    <line x1="0" y1="${L.line-L.band}" x2="100" y2="${L.line-L.band}" stroke="#22C55E" stroke-width=".35" stroke-dasharray="1.5 1" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="${L.line+L.band}" x2="100" y2="${L.line+L.band}" stroke="#22C55E" stroke-width=".35" stroke-dasharray="1.5 1" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="${L.line}" x2="100" y2="${L.line}" stroke="#EF4444" stroke-width="3" vector-effect="non-scaling-stroke"/>
    ${L.label?`<rect x="${L.label[0]}" y="${L.label[1]}" width="${L.label[2]-L.label[0]}" height="${L.label[3]-L.label[1]}" fill="none" stroke="#FACC15" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`:""}
  </svg>`;
}
function pabDrawGuide(ctx, w, h, side){
  const L=PAB_LAYOUT[side], y=v=>v*h/100, x=v=>v*w/100, lw=Math.max(2,Math.round(w/400));
  ctx.save();
  ctx.fillStyle="rgba(34,197,94,.18)"; ctx.fillRect(0,y(L.line-L.band),w,y(L.band*2));
  ctx.strokeStyle="#22C55E"; ctx.lineWidth=lw; ctx.setLineDash([lw*6,lw*4]);
  [L.line-L.band,L.line+L.band].forEach(v=>{ ctx.beginPath(); ctx.moveTo(0,y(v)); ctx.lineTo(w,y(v)); ctx.stroke(); });
  ctx.setLineDash([]); ctx.strokeStyle="#EF4444"; ctx.lineWidth=lw*2; ctx.beginPath(); ctx.moveTo(0,y(L.line)); ctx.lineTo(w,y(L.line)); ctx.stroke();
  ctx.restore();
}
function pabStamp(ctx, w, h, text){
  const fs=Math.max(16,Math.round(w/48)), pad=Math.round(fs*.6), bh=fs+pad*2;
  ctx.fillStyle="rgba(15,23,42,.85)"; ctx.fillRect(0,h-bh,w,bh);
  ctx.fillStyle="#fff"; ctx.font=`600 ${fs}px sans-serif`; ctx.textBaseline="middle"; ctx.fillText(text,pad,h-bh/2,w-pad*2);
}
function canvasFrom(src, maxSide){
  const sw=src.videoWidth||src.naturalWidth||src.width, sh=src.videoHeight||src.naturalHeight||src.height, s=Math.min(1,maxSide/Math.max(sw,sh));
  const c=document.createElement("canvas"); c.width=Math.round(sw*s); c.height=Math.round(sh*s); c.getContext("2d").drawImage(src,0,0,c.width,c.height); return c;
}
const toBlob=(c,q=.88)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("이미지 변환 실패")),"image/jpeg",q));
async function readBarcodes(canvas){
  if(!("BarcodeDetector" in window)) return {supported:false, codes:[]};
  try{
    const sup = await BarcodeDetector.getSupportedFormats();
    const formats = ["data_matrix","qr_code","code_128","code_39"].filter(f=>sup.includes(f));
    if(!formats.length) return {supported:false, codes:[]};
    const found = await new BarcodeDetector({formats}).detect(canvas);
    return {supported:true, codes:[...new Set(found.map(b=>String(b.rawValue||"").trim()).filter(Boolean))]};
  }catch(e){ return {supported:false, codes:[], err:e.message}; }
}

        await rpc("qms_pab_attach",{p_id:id,p_photo:p1,p_overlay:p2});
        box.hidden=true; box.innerHTML="";
        msg($("#pm"), judgment==="OK"?"ok":"err", `저장 #${id} · ${shift} ${stage} ${side} ${judgment}${judgment==="NG"?" — 변동점 기록에도 자동 등록됨. 라인 정지·격리 절차를 진행하세요.":""}${side==="좌"?" · 이어서 ② 오른쪽을 찍으세요":""}`);
        loadToday(); loadList(); window.scrollTo(0,0);
      }catch(err){ msg($("#rvm"),"err", id?`기록 #${id}은 저장됐지만 사진 저장 실패: ${err.message}`:"저장 실패: "+err.message); b.disabled=false; b.textContent="저장"; }
    };
  }

  let list=[];
  const loadList = async () => {
    try{ list = await rpc("qms_pab_list",{p_from:$("#pf").value,p_to:$("#pt").value,p_include_test:$("#pit").checked,p_ng_only:$("#png").checked});
      const sets={}; list.forEach(r=>{ (sets[r.set_id] ||= {at:r.created_at, shift:r.shift, stage:r.stage, lot:null, reporter:r.reporter, kind:r.record_kind, side:{}}).side[r.side]=r;
        if(r.lot_barcode) sets[r.set_id].lot=r.lot_barcode; if(r.created_at<sets[r.set_id].at) sets[r.set_id].at=r.created_at; });
      const arr=Object.values(sets).sort((a,b)=>b.at.localeCompare(a.at));
      const cellH=r=>r?`<div><div class="t" style="aspect-ratio:3/4;max-width:180px">${r.overlay_path?`<img data-path="${esc(r.overlay_path)}" alt="${r.side}">`:`<div class="muted">사진 없음</div>`}</div>
          <span class="pill ${r.judgment==="OK"?"ok":"ng"}">${r.side} ${r.judgment}</span>${r.ng_cause?` <span class="muted">${esc(r.ng_cause)}</span>`:""}</div>`:`<div class="muted">미등록</div>`;
      $("#plist").innerHTML = arr.length ? arr.map(s=>`<div class="rep"><div class="hd"><b>${fmtDT(s.at)}</b> · ${s.shift} ${s.stage} · ${esc(s.reporter)}${s.kind==="TEST"?' <span class="pill test">시험</span>':""}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">${cellH(s.side["좌"])}${cellH(s.side["우"])}</div></div>`).join("") : `<div class="muted">기록이 없습니다.</div>`;
      fillPhotos($("#plist"));
    }catch(e){ msg($("#plist"),"err",e.message); }
  };
  $("#pgo").onclick=loadList;
  $("#pcsv").onclick=()=>downloadCsv(`PAB심라인증빙_${$("#pf").value}_${$("#pt").value}.csv`,["번호","촬영시각","교대","구분","좌우","판정","NG원인","메모","세트","작성자","구분(시험)"],
    list.map(r=>[r.id,new Date(r.created_at).toLocaleString("ko-KR"),r.shift,r.stage,r.side,r.judgment,r.ng_cause,r.note,r.set_id,r.reporter,r.record_kind]));
  loadToday(); loadList();
}


boot();
</script>
</body>
</html>
