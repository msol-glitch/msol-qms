:root{
  --ink:#123B2F; --ink2:#1B4A3C; --paper:#FFFFFF; --sheet:#FFFFFF; --rule:#E4E2DA; --grid:#E2E4E8; --grid2:#D6D9DE; --brass:#B49A5E; --champ:#C8B88A;
  --fg:#18201D; --muted:#66706B; --blue:#123B2F; --blue-soft:#F4F1E8; --orange:#B49A5E;
  --ok:#2F6B4F; --ok-soft:#E5EFE8; --ng:#9E2B25; --ng-soft:#F6E6E3; --wait:#8A6420; --wait-soft:#F4ECDC; --test:#4B4F8C; --test-soft:#E9E9F2;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{position:relative;isolation:isolate;min-height:100vh;font:15px/1.55 var(--sans);color:var(--fg);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,16px 16px,16px 16px;background-attachment:fixed}

body.is-login::after{opacity:.32}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:3px solid var(--orange);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.hbar{max-width:960px;margin:0 auto;display:flex;align-items:stretch;gap:12px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:#A8B2AD}
.tblock{display:grid;grid-template-columns:auto auto;border:1px solid #2F3B36;font-size:11.5px;line-height:1.3}
.tblock div{padding:4px 8px;border-bottom:1px solid #2F3B36}
.tblock div:nth-child(odd){color:#A8B2AD;border-right:1px solid #2F3B36}
.tblock div:nth-last-child(-n+2){border-bottom:0}
.tblock div:nth-child(even){font-weight:600}
#btnLogout{align-self:center;background:transparent;color:#D9DCD6;border:1px solid #4A5550;border-radius:4px;padding:8px 10px;font:inherit;font-size:12.5px;min-height:40px}
main{max-width:960px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.panel{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:0 1px 0 rgba(15,23,42,.04)}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.phead small{color:var(--muted);font-size:12.5px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:#fff;border:1px solid #B9C4D2;border-radius:4px;padding:11px 12px;width:100%;min-width:0;min-height:48px}
input[readonly]{background:#F3F6F9;color:var(--muted)}

let session = null, me = null, current = null;
function loadSession(){ try{ session = JSON.parse(localStorage.getItem("qms_session")||"null"); }catch(e){ session=null; } }
function saveSession(s){ session=s; try{ s ? localStorage.setItem("qms_session",JSON.stringify(s)) : localStorage.removeItem("qms_session"); }catch(e){} }
async function authCall(grant, body){
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, {method:"POST", headers:{apikey:SB_KEY,"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ const m = j.error_description||j.msg||j.message||"";
    throw new Error((j.error_code==="invalid_credentials" || /invalid login credentials/i.test(m)) ? "아이디 또는 비밀번호가 맞지 않습니다 (계정이 아직 발급되지 않았을 수 있습니다)" : (m||"로그인 실패")); }
  return {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600)};
}
async function token(){
  if(!session) throw new Error("로그인이 필요합니다");
  if(session.expires_at - Date.now()/1000 < 60){
    try{ saveSession(await authCall("refresh_token",{refresh_token:session.refresh_token})); }
    catch(e){ saveSession(null); showLogin("세션이 만료되었습니다. 다시 로그인하세요."); throw e; }
  }
  return session.access_token;
}
const ERR_KO = {"Unauthorized":"이 기능을 사용할 권한이 없습니다","login required":"로그인이 필요합니다","not authorized":"이 기능을 사용할 권한이 없습니다"};
async function rpc(name, args={}){
  let r;
  try{
    r = await fetch(`${SB_URL}/rest/v1/rpc/${name}`, {method:"POST", headers:{apikey:SB_KEY, Authorization:`Bearer ${await token()}`, "Content-Type":"application/json"}, body:JSON.stringify(args)});
  }catch(e){ throw new Error("서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요."); }
  const j = await r.json().catch(()=>null);
  if(!r.ok){ const m = j?.message || `오류 ${r.status}`; throw new Error(ERR_KO[m] || m); }
  return j;
}
async function adminFn(body){
  const r = await fetch(`${SB_URL}/functions/v1/qms-admin-users`, {method:"POST", headers:{apikey:SB_KEY, Authorization:`Bearer ${await token()}`, "Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || `오류 ${r.status}`);
  return j;
}

    <div><h2 class="serif" style="border:0;padding:0;font-size:22px">통합 품질·생산 관리시스템</h2>
    <div class="tb"><div>품질 QMS · 생산관리 · 생산 · 자재</div><div>IATF 16949</div></div></div>
    <div id="lm">${note?`<div class="msg info">${esc(note)}</div>`:""}</div>
    <label>아이디 (또는 이메일)<input id="lid" autocomplete="username" autocapitalize="none" required></label>
    <label>비밀번호<input id="lpw" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" id="lbtn">로그인</button>
    <div class="muted">직원은 발급받은 아이디만, 대표 계정은 이메일 전체를 넣습니다. 계정은 관리자가 개인별로 발급합니다.</div></form>`;
  $("#fLogin").onsubmit = async e => {
    e.preventDefault(); const b=$("#lbtn"); b.disabled=true; msg($("#lm"),"","");
    let id = $("#lid").value.trim(); if(!id.includes("@")) id = `${id.toLowerCase()}@${LOGIN_DOMAIN}`;
    try{ saveSession(await authCall("password",{email:id,password:$("#lpw").value})); await boot(); }
    catch(err){ msg($("#lm"),"err",err.message); b.disabled=false; }
  };
}
$("#btnLogout").onclick = async () => {
  try{ await fetch(`${SB_URL}/auth/v1/logout`,{method:"POST",headers:{apikey:SB_KEY,Authorization:`Bearer ${session?.access_token}`}}); }catch(e){}
  saveSession(null); showLogin("로그아웃되었습니다.");
};
async function boot(){
  loadSession(); if(!session) return showLogin();
  try{ me = await rpc("qms_me"); }catch(e){ saveSession(null); return showLogin(e.message); }
  if(!me.active){ $("#app").innerHTML=`<div class="panel"><div class="msg err">계정이 아직 승인되지 않았습니다. 관리자에게 권한 등록을 요청하세요.</div></div>`; $("#btnLogout").hidden=false; return; }
  const uname=(me.email||"").replace("@"+LOGIN_DOMAIN,"");

function materialPicker(host, onPick, initial){
  host.innerHTML = `<label>자재 (품번·품명·차종·업체 검색)<input class="mq" placeholder="예: N1000, 글로브, GN7, 니프코" autocomplete="off"></label>
    <div class="sel" hidden></div><div class="results" hidden></div>`;
  const q=$(".mq",host), sel=$(".sel",host), res=$(".results",host); let t=null, last=[];
  const show = m => { sel.hidden=false; sel.innerHTML=`<div><b class="code">${esc(m.material_code)}</b> ${esc(m.material_name)}<div class="muted">${esc(m.vehicle)} · ${esc(m.supplier)} ${m.color_code?"· "+esc(m.color_code):""}</div></div><button type="button" class="btn ghost">변경</button>`;
    $("button",sel).onclick=()=>{ sel.hidden=true; q.parentElement.hidden=false; onPick(null); q.focus(); }; q.parentElement.hidden=true; res.hidden=true; };
  q.oninput = () => { clearTimeout(t); t=setTimeout(async()=>{
    const v=q.value.trim(); if(!v){res.hidden=true;return;}
    try{ last = await rpc("qms_material_search",{p_q:v,p_limit:30}); }catch(e){ res.hidden=false; res.innerHTML=`<div class="msg err">${esc(e.message)}</div>`; return; }
    res.hidden=false;
    res.innerHTML = last.length ? last.map((m,i)=>`<button type="button" data-i="${i}"><b class="code">${esc(m.material_code)}</b> ${esc(m.material_name)}<div class="muted">${esc(m.vehicle)} · ${esc(m.supplier)}</div></button>`).join("") : `<div class="muted" style="padding:10px">검색 결과가 없습니다</div>`;
  },250); };
  res.onclick = e => { const b=e.target.closest("button[data-i]"); if(!b) return; const m=last[b.dataset.i]; show(m); onPick(m); };
  if(initial) show(initial);
}

    <div class="btns"><button class="btn primary" id="sv">${edit?"수정 저장":"저장"}</button>${edit?`<button type="button" class="btn ghost" id="cancel">취소</button>`:""}</div>
    <div class="muted">입고수량을 입력하면 PPM이 확정되고, 비우면 '입고수량 대기'로 저장되어 공식 PPM에서 빠집니다.</div>
  </form>`;

    if(!$("#meth").value) errs.push("검사방식을 선택하세요");
    if(!(iq>0)) errs.push("검사수량은 1 이상");
    if(jq>iq) errs.push("불량수량이 검사수량보다 많습니다");

function downloadCsv(name, head, rows){
  const c = v => { const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  const blob = new Blob(["﻿"+[head,...rows].map(r=>r.map(c).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- 사진: 자동 축소 · 업로드 · 열람 ---------- */
const BUCKET = "quality-evidence";
function shrinkImage(file, maxSide=1600, quality=0.8){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxSide/Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("사진 변환 실패")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`이 사진 형식은 열 수 없습니다 (${file.name}). 카메라 설정을 '호환성 우선'으로 하거나 다시 촬영하세요.`)); };
    img.src = url;
  });
}
async function uploadPhoto(path, blob, type="image/jpeg"){
  const r = await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`, {method:"POST", headers:{apikey:SB_KEY, Authorization:`Bearer ${await token()}`, "Content-Type":type, "x-upsert":"false"}, body:blob});
  if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.message || `업로드 오류 ${r.status}`); }
}
const photoCache = {};
// 로그인 토큰으로 직접 내려받아 화면에 표시 (서버 주소를 이미지에 직접 넣으면 일부 브라우저가 차단함)
async function signedUrl(path){
  if(photoCache[path]) return photoCache[path];
  const r = await fetch(`${SB_URL}/storage/v1/object/authenticated/${BUCKET}/${path}`, {headers:{apikey:SB_KEY, Authorization:`Bearer ${await token()}`}});
  if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.message || "열람 권한 없음"); }
  const url = URL.createObjectURL(await r.blob()); photoCache[path] = url; return url;
}
function lightbox(src){ const d=document.createElement("div"); d.id="lightbox"; d.innerHTML=`<img src="${esc(src)}" alt="증빙사진">`; d.onclick=()=>d.remove(); document.body.appendChild(d); }
async function fillPhotos(host){
  for(const img of host.querySelectorAll("img[data-path]")){
    try{ img.src = await signedUrl(img.dataset.path); img.onclick=()=>lightbox(img.src); }
    catch(e){ img.replaceWith(Object.assign(document.createElement("div"),{className:"muted",style:"padding:6px;font-size:12px",textContent:"열람 불가"})); }
  }
  for(const au of host.querySelectorAll("audio[data-path]")){
    try{ au.src = await signedUrl(au.dataset.path); }catch(e){ au.replaceWith(Object.assign(document.createElement("div"),{className:"muted",textContent:"음성 열람 불가"})); }
  }
}

const fmtDT = v => new Date(v).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
const AUDIO_EXT = {"audio/webm":"webm","audio/mp4":"m4a","audio/aac":"aac","audio/ogg":"ogg","audio/mpeg":"mp3","audio/x-m4a":"m4a"};
function mediaHtml(r){

  };

/* ---------- 업체통보: 규칙 기반 초안 (외부 AI 미사용) ---------- */
const NOTICE_DEFECTS = ["가스","융착불량","터치업","스크류 누락","누락","돌출량","긁힘","찍힘","스크래치","이종","미성형","컬러이색","변형","오염","조립불량","기타"];
const DEFAULT_REQUEST = "- 순성 사내재고 수정 및 선별 요청 드립니다.\n순성공장내 재고부터 대응 부탁드리며 시간 공유 부탁드립니다.";
// 조치로 분류: 명확한 조치 단어가 있거나 '~중'으로 끝나는 문장. 그 외는 문제점.
const ACTION_RE = /(격리|선별|교체|재작업|반송|폐기|보류|사용중지|조치|수정\s*$|수정중|수정\s*완료|진행중|대응중|대기중|비가동중|\S+중\s*$)/;
const VEH_RE = /\b(KA4|CE1|CT1|SV1|GN7|SP3K|CV1|MV1|GL3)\b/i;
const pad2 = n => String(n).padStart(2,"0");
const hm = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
function applyRules(text, rules){
  let t = text; (rules||[]).filter(r=>r.active).forEach(r=>{ t = t.split(r.from).join(r.to); }); return t;
}
function buildNoticeDraft(o){
  // o: {line, memo, qty, defect, repeat, occurred(Date), dtStart(Date|null), dtEnd(Date|null), request, rules}
  const memo = applyRules(String(o.memo||"").trim(), o.rules);
  const segs = memo.split(/\n|[.。]\s|,|\s\/\s|·/).map(s=>s.replace(/^[-•\s]+/,"").trim()).filter(Boolean);
  const problem = segs.filter(s=>!ACTION_RE.test(s)), action = segs.filter(s=>ACTION_RE.test(s));
  const parts = String(o.line||"").split(" "); const lineVeh = (parts[0]||"").split("/")[0]; const item = parts.slice(1).join(" ");
  const vm = memo.match(VEH_RE); const veh = vm ? vm[1].toUpperCase().replace("SP3K","SP3k") : lineVeh;
  const d = o.occurred || new Date();
  const out = [`${veh}${item?" "+item:""} (${d.getMonth()+1}월${d.getDate()}일)`, "", "1. 문제점 :"];
  (problem.length ? problem : [o.defect||"불량 발생"]).forEach(s=>out.push("- "+s));
  out.push(`- 불량수량 ${Number(o.qty||0).toLocaleString("ko-KR")}EA${o.repeat>=2?` (금월 동일유형 ${o.repeat}회째)`:""}`);
  out.push("");
  let act = action.join(", ") || "해당 불량 격리";
  if(o.dtStart && o.dtEnd){ const m = Math.max(0, Math.round((o.dtEnd-o.dtStart)/60000)); act += ` (라인 비가동 ${hm(o.dtStart)}~${hm(o.dtEnd)} 총 ${m}분)`; }
  else if(o.dtStart){ act += ` (라인 비가동 ${hm(o.dtStart)}~ 진행중)`; }
  out.push("2. 조치사항 : "+act, "", "3. 요청사항 :", o.request || DEFAULT_REQUEST);
  return out.join("\n");
}
// 사람이 고친 단어 치환 추출 (학습 기록용)
function wordEdits(a, b){
  const A=a.split(/\s+/).filter(Boolean), B=b.split(/\s+/).filter(Boolean); if(A.length*B.length>90000) return [];
  const L=Array.from({length:A.length+1},()=>new Int16Array(B.length+1));
  for(let i=A.length-1;i>=0;i--) for(let j=B.length-1;j>=0;j--) L[i][j]= A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  // 1) 같음/삭제/추가 단위 작업열
  const ops=[]; let i=0,j=0;
  while(i<A.length||j<B.length){
    if(i<A.length&&j<B.length&&A[i]===B[j]){ ops.push(["=",A[i],B[j]]); i++; j++; }
    else if(j<B.length&&(i>=A.length||L[i][j+1]>=L[i+1][j])){ ops.push(["+",null,B[j++]]); }
    else { ops.push(["-",A[i++],null]); }
  }
  // 2) 같은 단어 1개 이하를 사이에 둔 변경은 한 구절로 묶음 (예: "LBAN 케이스" → "CASE LBAN 사양")
  const edits=[]; let k=0;
  while(k<ops.length){
    if(ops[k][0]==="="){ k++; continue; }
    let s=k, e=k;
    while(e+1<ops.length && (ops[e+1][0]!=="=" || (e+2<ops.length && ops[e+2][0]!=="=" && ops[e+1][0]==="="))) e++;
    // 앞쪽 같은 단어 1개를 문맥으로 포함 (순수 추가만 있는 경우 위치를 잡기 위해)
    let grp=ops.slice(s,e+1); const onlyIns=grp.every(o=>o[0]!=="-");
    if(onlyIns && s>0 && ops[s-1][0]==="=") grp=[ops[s-1],...grp];
    if(onlyIns && e+1<ops.length && ops[e+1][0]==="=") grp=[...grp,ops[e+1]];
    const f=grp.filter(o=>o[1]!=null).map(o=>o[1]).join(" "), t=grp.filter(o=>o[2]!=null).map(o=>o[2]).join(" ");
    const nA=grp.filter(o=>o[1]!=null).length, nB=grp.filter(o=>o[2]!=null).length;
    if(f && f!==t && nA<=5 && nB<=6 && f.length<=80 && t.length<=80 && !/\d{2,}/.test(f)) edits.push({from:f,to:t});
    k=e+1;
  }
  return edits.slice(0,50);
}

      dtStart:$("#ndt").checked?toDate($("#nds").value):null, dtEnd:$("#ndt").checked?toDate($("#nde").value):null, request:$("#nreq").value.trim(), rules});
    $("#nfinal").value=drafted; $("#nedit").hidden=false; $("#nfinal").focus();
  };
  const drawThumbs=()=>{ $("#np").innerHTML = photos.map((p,i)=>`<div class="t"><img src="${p.url}" alt="사진 ${i+1}"><button type="button" data-i="${i}" aria-label="삭제">×</button></div>`).join("")
      + (photos.length<4?`<label class="addph" for="nf">+ 사진<br>${photos.length}/4</label>`:""); };
  $("#np").onclick=e=>{ const b=e.target.closest("button[data-i]"); if(!b) return; const [p]=photos.splice(+b.dataset.i,1); URL.revokeObjectURL(p.url); drawThumbs(); };
  $("#nf").onchange=async e=>{ const fs=[...e.target.files].slice(0,4-photos.length); e.target.value="";
    for(const f of fs){ try{ const blob=await shrinkImage(f); photos.push({blob,url:URL.createObjectURL(blob)}); }catch(err){ msg($("#nm"),"err",err.message); } } drawThumbs(); };
  drawThumbs();
  if(pre?.copy){ (async()=>{ const r=pre.copy; if(LINES.includes(r.line_name)){ line=r.line_name; pick($("#nl"),line); }
      defect=r.defect_type; pick($("#nd"),defect); $("#nq").value=r.defect_qty; await loadSup();
      if(![...$("#ns").options].some(o=>o.value===r.supplier)) $("#ns").insertAdjacentHTML("beforeend",`<option>${esc(r.supplier)}</option>`);
      $("#ns").value=r.supplier; supplier=r.supplier; await useText(r.final_text,"이전통보복사",r.id); })(); }
  $("#fN").onsubmit = async e => {
    e.preventDefault(); const fin=$("#nfinal").value.trim(); if(fin.length<5) return msg($("#nm"),"err","통보문이 비어 있습니다");
    { const m=fin.match(/불량수량\s*(\d[\d,]*)\s*EA/); const fq=parseInt($("#nq").value);
      if(m && parseInt(m[1].replace(/,/g,""))!==fq && !confirm(`통보문의 불량수량(${m[1]}EA)과 입력한 불량수량(${fq||"-"}EA)이 다릅니다.\n집계는 입력한 수량으로 됩니다. 그대로 저장할까요?`)) return; }
    { const er=[]; if(!line) er.push("라인"); if(!supplier) er.push("업체"); if(!defect) er.push("불량유형"); if(!(parseInt($("#nq").value)>0)) er.push("불량수량");
      if(er.length){ window.scrollTo(0,0); return msg($("#nm"),"err",er.join(", ")+"을(를) 위에서 선택·입력하세요 (클레임 집계 근거)"); } }
    if(!confirm(`${supplier} · ${defect} ${$("#nq").value}EA\n사진 ${photos.length}장\n\n저장할까요? (저장 후 카톡으로 보냅니다)`)) return;
    const b=$("#nsave"); b.disabled=true; b.textContent="저장 중…"; let id=null;
    try{
      const ds=$("#ndt").checked?toDate($("#nds").value):null, de=$("#ndt").checked?toDate($("#nde").value):null;
      const r = await rpc("qms_notice_create",{p:{line_name:line,supplier,defect_type:defect,defect_qty:$("#nq").value,occurred_at:new Date($("#no").value).toISOString(),
        downtime_start:ds?ds.toISOString():"",downtime_end:de?de.toISOString():"",raw_memo:$("#nmemo").value.trim(),draft_text:drafted,final_text:fin,
        edits:wordEdits(drafted,fin),record_kind:$("#ntest").checked?"TEST":"NORMAL",promote_ids:pre?pre.ids:undefined,source_kind:sourceKind,copied_from:copiedFrom}});
      id=r.id; const paths=[];
      for(let i=0;i<photos.length;i++){ b.textContent=`사진 올리는 중 ${i+1}/${photos.length}`; const path=`${r.uid}/sn/${id}/${Date.now()}_${i+1}.jpg`; await uploadPhoto(path,photos[i].blob); paths.push(path); }
      if(paths.length) await rpc("qms_notice_attach",{p_id:id,p_paths:paths});
      ls("qms_notice_sup_"+line, supplier); ls("qms_notice_req", $("#nreq").value.trim());
      showShare(id, fin, photos.map((p,i)=>new File([p.blob],`통보_${id}_${i+1}.jpg`,{type:"image/jpeg"})));
    }catch(err){ msg($("#nm"),"err", id?`통보 #${id}는 저장됐지만 사진 저장 실패: ${err.message}`:"저장 실패: "+err.message); b.disabled=false; b.textContent="저장"; }
  };
  function showShare(id, text, files){
    $("#fN").hidden=true; const s=$("#nshare"); s.hidden=false; window.scrollTo(0,0);
    const canFiles = files.length && navigator.canShare && navigator.canShare({files});
    s.innerHTML = `<h2>저장 완료 #${id} — 카톡으로 보내기</h2><div id="shm"></div>
      <div class="msg info">카톡 방을 고른 뒤 @멘션을 붙여 보내세요. 사진과 글이 같이 안 넘어가면 ③을 차례로 누르세요.</div>
      <div class="sharebar">
        <button class="btn primary" id="sh3" style="min-height:58px;font-size:17px">📋 글 복사 → 카톡에 붙여넣기</button>
        ${canFiles||navigator.share?`<button class="btn" id="sh1">카톡으로 보내기 (사진+글)</button>`:""}
        ${canFiles?`<button class="btn" id="sh2">사진만 보내기 (${files.length}장)</button>`:""}
        <button class="btn ghost" id="sh4">카톡 전송 완료 표시</button>
        <button class="btn ghost" id="sh5">이 업체로 돌아가기</button></div>
      <textarea class="notice-text" readonly style="margin-top:10px">${esc(text)}</textarea>`;
    const done = async () => { try{ await rpc("qms_notice_update",{p_id:id,p:{mark_sent:true}}); msg($("#shm"),"ok",`#${id} 발송 기록됨`); }catch(e){ msg($("#shm"),"err",e.message); } };
    const share = async data => { try{ await navigator.share(data); await done(); }catch(e){ if(e.name!=="AbortError") msg($("#shm"),"err","공유 실패: "+e.message+" — 버튼을 쓰세요"); } };
    if($("#sh1")) $("#sh1").onclick=()=>share(canFiles?{files,text}:{text});
    if($("#sh2")) $("#sh2").onclick=()=>share({files});
    $("#sh3").onclick=async()=>{ try{ await navigator.clipboard.writeText(text); msg($("#shm"),"ok","복사됨 — 카톡 입력창을 길게 눌러 붙여넣으세요"); }
      catch(e){ const t=$("#nshare textarea"); t.removeAttribute("readonly"); t.select(); document.execCommand("copy"); msg($("#shm"),"ok","복사됨"); } };
    $("#sh4").onclick=done; $("#sh5").onclick=()=>viewSupplier(supplier);
  }
}

/* ---------- SP3k PAB 심라인 증빙사진 (장기 보관) ---------- */
// 판정: 위·아래 도어판 틈이 뒷면 밀링 홈 폭 안이면 OK, 벗어나면 NG (안전 직결)
const PAB_GUIDE_KEY = {좌:"pab_left", 우:"pab_right"};
// 가이드 위치(화면 비율 %). 검증 대상은 도어판 틈 ↔ 밀링 홈 하나(10-28 대표). 좌=세로 끝단 근접, 우=90도 회전 끝단 근접. 라벨·바코드 안 씀
const PAB_LAYOUT = {
  좌:{line:50, band:3.5, label:null, hint:"휴대폰 세로 · 왼쪽 끝단을 가까이 · 빨간선에 도어판 틈"},
  우:{line:50, band:3.5, label:null, hint:"휴대폰 90도 회전(가로) · 빨간선에 도어판 틈"}
};
const myUid = () => { try{ const b=session.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"); return JSON.parse(decodeURIComponent(escape(atob(b + "===".slice((b.length+3)%4))))).sub; }catch(e){ return ""; } };
const pabShiftNow = () => { const h=new Date().getHours(); return (h>=8 && h<20) ? "주간" : "야간"; };
function pabOverlaySvg(side){
  const L=PAB_LAYOUT[side];
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
    <rect x="0" y="${L.line-L.band}" width="100" height="${L.band*2}" fill="rgba(34,197,94,.18)"/>
    <line x1="0" y1="${L.line-L.band}" x2="100" y2="${L.line-L.band}" stroke="#3F8A64" stroke-width=".35" stroke-dasharray="1.5 1" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="${L.line+L.band}" x2="100" y2="${L.line+L.band}" stroke="#3F8A64" stroke-width=".35" stroke-dasharray="1.5 1" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="${L.line}" x2="100" y2="${L.line}" stroke="#B8433B" stroke-width="3" vector-effect="non-scaling-stroke"/>
    ${L.label?`<rect x="${L.label[0]}" y="${L.label[1]}" width="${L.label[2]-L.label[0]}" height="${L.label[3]-L.label[1]}" fill="none" stroke="#C9A86A" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`:""}
  </svg>`;
}
function pabDrawGuide(ctx, w, h, side){
  const L=PAB_LAYOUT[side], y=v=>v*h/100, x=v=>v*w/100, lw=Math.max(2,Math.round(w/400));
  ctx.save();
  ctx.fillStyle="rgba(34,197,94,.18)"; ctx.fillRect(0,y(L.line-L.band),w,y(L.band*2));
  ctx.strokeStyle="#3F8A64"; ctx.lineWidth=lw; ctx.setLineDash([lw*6,lw*4]);
  [L.line-L.band,L.line+L.band].forEach(v=>{ ctx.beginPath(); ctx.moveTo(0,y(v)); ctx.lineTo(w,y(v)); ctx.stroke(); });
  ctx.setLineDash([]); ctx.strokeStyle="#B8433B"; ctx.lineWidth=lw*2; ctx.beginPath(); ctx.moveTo(0,y(L.line)); ctx.lineTo(w,y(L.line)); ctx.stroke();
  ctx.restore();
}
function pabStamp(ctx, w, h, text){
  const fs=Math.max(16,Math.round(w/48)), pad=Math.round(fs*.6), bh=fs+pad*2;
  ctx.fillStyle="rgba(15,23,42,.85)"; ctx.fillRect(0,h-bh,w,bh);
  ctx.fillStyle="#fff"; ctx.font=`600 ${fs}px sans-serif`; ctx.textBaseline="middle"; ctx.fillText(text,pad,h-bh/2,w-pad*2);
}
function canvasFrom(src, maxSide){
  const sw=src.videoWidth||src.naturalWidth||src.width, sh=src.videoHeight||src.naturalHeight||src.height, s=Math.min(1,maxSide/Math.max(sw,sh));
  const c=document.createElement("canvas"); c.width=Math.round(sw*s); c.height=Math.round(sh*s); c.getContext("2d").drawImage(src,0,0,c.width,c.height); return c;
}
const toBlob=(c,q=.88)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("이미지 변환 실패")),"image/jpeg",q));
async function readBarcodes(canvas){
  if(!("BarcodeDetector" in window)) return {supported:false, codes:[]};
  try{
    const sup = await BarcodeDetector.getSupportedFormats();
    const formats = ["data_matrix","qr_code","code_128","code_39"].filter(f=>sup.includes(f));
    if(!formats.length) return {supported:false, codes:[]};
    const found = await new BarcodeDetector({formats}).detect(canvas);
    return {supported:true, codes:[...new Set(found.map(b=>String(b.rawValue||"").trim()).filter(Boolean))]};
  }catch(e){ return {supported:false, codes:[], err:e.message}; }
}

const _crcT=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();

function _zip(files){ const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  for(const f of files){ const name=enc.encode(f.name), data=typeof f.data==="string"?enc.encode(f.data):f.data, crc=_crc32(data);
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,name.length,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name); off+=30+name.length+data.length; }
  const csize=central.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,csize,true); e.setUint32(16,off,true);

function makeXlsx(sheets){

  const col=i=>{ let s=""; i++; while(i){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; };

      if(v===null||v===undefined||v==="") return ""; if(typeof v==="number"&&isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
      if(typeof v==="boolean") return `<c r="${ref}" t="b"><v>${v?1:0}</v></c>`; const t=String(v).slice(0,32000);
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${x(t)}</t></is></c>`; }).join("")}</row>`).join("")}</sheetData></worksheet>`;
  const files=[
    {name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`},
    {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${x(s.name.replace(/[\\\/\?\*\[\]:]/g," ").slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`},
    {name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}</Relationships>`},
    ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXml(s.rows)}))];

      if(!known(no)){ $("#dinfo").innerHTML=`<div class="msg err">${esc(t.line_name||t.vehicle)} 대장에 없는 번호입니다</div>`; return; }
      try{ const h=await rpc("prod_pallet_history",{p_vehicle:t.vehicle,p_pallet_no:no,p_include_test:isTest()});
        $("#dinfo").innerHTML=`<div class="muted" style="margin-top:4px">상태 <b>${esc(h.status)}</b> · 마지막 점검 ${fmtD(h.last_check)} · 마지막 청소 ${fmtD(h.last_clean)}${h.last_clean?` (${daysAgo(h.last_clean)}일 전)`:""}</div>`
          + (doneToday(no)?`<div class="msg info">오늘 이미 점검한 팔레트입니다. 다시 저장하면 기록이 하나 더 남습니다.</div>`:"");
      }catch(e){ $("#dinfo").innerHTML=""; } },300); };
    $("#dsave").onclick=async()=>{ const no=normNo($("#dn").value); const b=$("#dsave");
      if(!no) return msg($("#dres"),"err","팔레트 번호를 입력하세요");
      if(!known(no)) return msg($("#dres"),"err","대장에 없는 번호입니다");
      if(anyNg() && !$("#dng").value.trim()) return msg($("#dres"),"err","NG 내용을 입력하세요");
      if(anyNg() && !photos.length) return msg($("#dres"),"err","NG 사진을 1장 이상 찍으세요");
      b.disabled=true; b.textContent="저장 중…";
      try{ const r=await rpc("prod_pallet_check_create",{p:{vehicle:t.vehicle,line_name:t.line_name||t.vehicle,pallet_no:no,items:vals,ng_note:anyNg()?$("#dng").value.trim():null,record_kind:isTest()?"TEST":"NORMAL"}});
        let up=0;
        if(photos.length){ const paths=[]; for(let i=0;i<photos.length;i++){ b.textContent=`사진 올리는 중 ${i+1}/${photos.length}`; const path=`${r.uid}/plt/${r.id}/${Date.now()}_${i}.jpg`; await uploadPhoto(path,photos[i].blob); paths.push(path); }
          up=await rpc("prod_pallet_attach",{p_id:r.id,p_paths:paths}); }
        await loadSt(); renderDetail();
        msg($("#dres"), r.judgment==="NG"?"err":"ok", `${no}번 저장 (#${r.id}) · 판정 ${r.judgment}${r.judgment==="NG"?" → 사용중지로 표시됨":""}${up?` · 사진 ${up}장`:""}${r.same_day_before?" · 오늘 "+r.same_day_before+"번째 재점검":""}${isTest()?" (시험용)":""}`);
      }catch(e){ msg($("#dres"),"err","저장 실패: "+e.message); b.disabled=false; sync(); } };
    sync();
  };
  const render=()=>{ document.querySelectorAll("#pmode button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode)); (mode==="quick"?renderQuick:renderDetail)(); };
  $("#pmode").onclick=e=>{ const b=e.target.closest("[data-m]"); if(b){ mode=b.dataset.m; render(); } };
  $("#ptest").onchange=async()=>{ await loadSt(); render(); };
  const pv=$("#pv"); if(pv) pv.onclick=async e=>{ const b=e.target.closest("[data-v]"); if(!b) return; t=pltVeh({vehicle:b.dataset.v}); nums.length=0;
    pv.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); await loadSt(); render(); };
  await loadSt(); render();
}

  $("#app").innerHTML=`<section class="panel"><h2>팔레트 이력 조회</h2>${vehChips(base.types,t.vehicle)}

          <span class="pill ${h.status==="사용중지"?"ng":h.status==="사용가능"?"ok":"wait"}" style="font-size:14px">${esc(h.status)}</span></h2>
        <div class="kpis"><div class="kpi"><div class="k">마지막 입고·점검</div><div class="v" style="font-size:19px">${fmtD(h.last_check)}</div><div class="muted">${sd==null?"":`${n0(sd)}일 전`}${unret?' · <b style="color:#9E2B25">미회수 의심</b>':""}</div></div>
          <div class="kpi"><div class="k">마지막 청소</div><div class="v" style="font-size:19px">${fmtD(h.last_clean)}</div><div class="muted">${cd==null?"":`${n0(cd)}일 전`}${cleanDue?' · <b style="color:#9A5B1E">청소 필요</b>':""}</div></div>
          <div class="kpi"><div class="k">기록</div><div class="v">${n0(h.rows.length)} 건</div><div class="muted">최근 30건까지 표시</div></div></div>
        <div class="muted" style="margin-top:6px">기준: 청소 ${t.clean_cycle_days}일 · 미회수 ${t.unreturned_days}일</div></section>
        <section class="panel"><h2>점검 이력</h2>${h.rows.length?h.rows.map(r=>{ const ngs=Object.entries(r.items||{}).filter(([k,v])=>v==="NG").map(([k])=>lbl[k]||k);
          return `<div class="rep"><div style="display:flex;justify-content:space-between;gap:8px"><b>${fmtDT(r.at)}</b><span><span class="pill ${r.judgment==="NG"?"ng":"ok"}">${r.judgment}</span>${r.kind==="TEST"?' <span class="pill test">시험</span>':""}</span></div>
            <div class="muted">${esc(r.line||"")} · ${esc(r.reporter||"")}</div>
            ${ngs.length?`<div style="color:#9E2B25;margin-top:4px">NG: ${ngs.map(esc).join(", ")}</div>`:""}${r.ng_note?`<div style="margin-top:4px">${esc(r.ng_note)}</div>`:""}
            ${r.photos&&r.photos.length?`<div style="margin-top:6px">${mediaHtml({photos:r.photos})}</div>`:""}</div>`; }).join(""):`<div class="muted">점검 기록이 없습니다.</div>`}</section>`;

}

  load();

async function viewSupplier(sup){
  $("#app").innerHTML = `<section class="panel"><button type="button" class="btn ghost" id="sback" style="min-height:40px">← 업체 목록</button>
    <h2 style="margin-top:8px">${esc(sup)}</h2><div id="sm"></div>
    <label class="check"><input type="checkbox" id="sit"> 시험용 기록 포함</label>
    <div class="kpis" id="sk"></div><div id="sflag"></div>
    <button type="button" class="btn primary" id="snew" style="width:100%;min-height:56px;margin-top:10px;font-size:17px">＋ 새 불량 통보 쓰기</button></section>
    <section class="panel"><h2>월별 이력 <span class="muted" style="font-size:13px;font-weight:400">최근 6개월 · 업체통보 기준</span></h2><div id="smon"></div></section>
    <section class="panel"><h2>이전 통보 <span class="muted" style="font-size:13px;font-weight:400">눌러서 바로 고쳐 쓰기</span></h2><div id="sprev"></div></section>`;
  $("#sback").onclick=()=>viewNotice();
  let prev=[];
  const load=async()=>{
    const it=$("#sit").checked;
    try{
      const [h, list] = await Promise.all([rpc("qms_supplier_history",{p_supplier:sup,p_months:6,p_include_test:it}), rpc("qms_notice_recent",{p_line:null,p_supplier:sup,p_limit:30})]);
      prev = list.filter(r=>it || r.record_kind!=="TEST");
      const ym=today().slice(0,7), cur=h.monthly.find(m=>m.month===ym)||{cnt:0,qty:0,downtime:0}, tot=h.monthly.reduce((a,m)=>({cnt:a.cnt+m.cnt,qty:a.qty+m.qty,dt:a.dt+m.downtime}),{cnt:0,qty:0,dt:0});
      $("#sk").innerHTML=[["이번달 통보",cur.cnt,"건"],["이번달 불량",cur.qty,"EA"],["이번달 비가동",cur.downtime,"분"],["6개월 누계",tot.qty,"EA"]]
        .map(([k,v,u],i)=>`<div class="kpi ${i===2&&v>0?"hl":""}"><div class="k">${k}</div><div class="v">${n0(v)} ${u}</div></div>`).join("");
      const f=h.by_type.filter(t=>t.month_cnt>=3);
      $("#sflag").innerHTML = f.map(t=>`<div class="flag8d" style="margin-top:8px">⚠ ${esc(t.defect_type)} 이번 달 ${t.month_cnt}회 — 대책서(8D) 요구 대상</div>`).join("")
        + (h.field_cnt?`<div class="muted" style="margin-top:6px">이번 달 현장 수시기록 ${h.field_cnt}건 별도 (참고자료)</div>`:"");
      const max=Math.max(1,...h.monthly.map(m=>m.qty));
      $("#smon").innerHTML = h.monthly.length ? `<div class="tablewrap"><table><thead><tr><th>월</th><th class="n">통보</th><th class="n">불량(EA)</th><th></th><th class="n">비가동(분)</th></tr></thead><tbody>${h.monthly.map(m=>`<tr><td>${m.month}</td><td class="n">${n0(m.cnt)}</td><td class="n">${n0(m.qty)}</td><td style="width:35%"><div style="height:10px;background:#18805C;border-radius:3px;width:${m.qty*100/max}%"></div></td><td class="n">${n0(m.downtime)}</td></tr>`).join("")}
          <tr class="total"><td>합계</td><td class="n">${n0(tot.cnt)}</td><td class="n">${n0(tot.qty)}</td><td></td><td class="n">${n0(tot.dt)}</td></tr></tbody></table></div>
          ${h.by_type.length?`<div class="muted" style="margin-top:6px">유형별: ${h.by_type.map(t=>`${esc(t.defect_type)} ${t.cnt}건·${n0(t.qty)}EA`).join(" / ")}</div>`:""}` : `<div class="muted">기록이 없습니다.</div>`;
      $("#sprev").innerHTML = prev.length ? prev.map((r,i)=>`<div class="rep"><div class="hd"><b>#${r.id}</b>${fmtDT(r.occurred_at)} · ${esc(r.line_name)} · ${esc(r.defect_type)} ${n0(r.defect_qty)}EA${r.record_kind==="TEST"?' <span class="pill test">시험</span>':""}</div>
          <div class="bd" style="max-height:8em;overflow:hidden">${esc(r.final_text)}</div><button type="button" class="btn primary" data-i="${i}">이 통보로 고쳐 쓰기</button></div>`).join("")
        : `<div class="muted">이전 통보가 없습니다. '새 불량 통보 쓰기'로 시작하세요. 카톡에 있던 글은 작성 화면의 '카톡 글 붙여넣기'로 옮길 수 있습니다.</div>`;
    }catch(e){ msg($("#sm"),"err",e.message); }
  };
  $("#sit").onchange=load;
  $("#snew").onclick=()=>viewNoticeForm({supplier:sup, line:(prev[0]&&prev[0].line_name)||null});
  $("#sprev").onclick=e=>{ const b=e.target.closest("button[data-i]"); if(!b) return; const r=prev[+b.dataset.i]; viewNoticeForm({supplier:sup, line:r.line_name, copy:r}); };
  load();
}

boot();
</script>
</body>
</html>
