<script>
// 라인 벽 QR 전용 입구. QR은 이 주소를 가리키므로, 정식본으로 옮길 때 TARGET만 바꾸면 QR을 다시 붙일 필요가 없습니다.
var TARGET = "test.html";
var q = new URLSearchParams(location.search), v = q.get("plt");
location.replace(TARGET + (v ? "#plt=" + encodeURIComponent(v) : ""));
</script></body></html>
