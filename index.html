[hidden]{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:3px solid var(--orange);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.hbar{max-width:960px;margin:0 auto;display:flex;align-items:stretch;gap:12px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:#93A3B8}
.tblock{display:grid;grid-template-columns:auto auto;border:1px solid #334155;font-size:11.5px;line-height:1.3}
.tblock div{padding:4px 8px;border-bottom:1px solid #334155}
.tblock div:nth-child(odd){color:#93A3B8;border-right:1px solid #334155}
.tblock div:nth-last-child(-n+2){border-bottom:0}
.tblock div:nth-child(even){font-weight:600}
#btnLogout{align-self:center;background:transparent;color:#CBD5E1;border:1px solid #475569;border-radius:4px;padding:8px 10px;font:inherit;font-size:12.5px;min-height:40px}
main{max-width:960px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.panel{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:0 1px 0 rgba(15,23,42,.04)}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.phead small{color:var(--muted);font-size:12.5px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:#fff;border:1px solid #B9C4D2;border-radius:4px;padding:11px 12px;width:100%;min-width:0;min-height:48px}
input[readonly]{background:#F3F6F9;color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
textarea{min-height:72px;resize:vertical}
.btn{font:inherit;font-weight:600;border:0;border-radius:4px;padding:12px 18px;min-height:48px;background:var(--ink2);color:#fff;cursor:pointer}
.btn.primary{background:var(--blue)}
.btn.accent{background:var(--orange)}
.btn.ghost{background:#E7ECF2;color:var(--fg)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.msg{border-radius:3px;padding:10px 12px;font-size:14px;border-left:4px solid}
.msg.ok{background:var(--ok-soft);color:#0F4D25;border-color:var(--ok)}
.msg.err{background:var(--ng-soft);color:#7A1A12;border-color:var(--ng)}
.msg.info{background:var(--blue-soft);color:#1E3A8A;border-color:var(--blue)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);display:flex;justify-content:center;gap:2px;
  padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));overflow-x:auto}
nav.tabs button{flex:1 1 0;max-width:120px;min-width:58px;background:transparent;border:0;color:#8C9BB0;font:inherit;font-size:11.5px;font-weight:600;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:#fff;border-top-color:var(--orange)}
.results{border:1px solid var(--rule);border-radius:3px;max-height:300px;overflow:auto;background:#fff}
.results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:#fff;padding:11px 12px;font:inherit;font-size:14px;cursor:pointer;min-height:52px}
.results button:hover{background:#F3F6F9}
.code{font-family:var(--mono);font-size:13px;letter-spacing:-.01em}
.sel{background:var(--blue-soft);border:1px solid #C7D5F5;border-radius:3px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.defects{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.def{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--rule);border-radius:3px;padding:4px 4px 4px 10px;font-size:13px;background:#FAFBFC}
.def input{width:66px;min-height:40px;padding:6px;text-align:right;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;border:1px solid var(--rule);background:var(--sheet)}
.kpi{padding:12px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi.hl{background:var(--ink);color:#fff}
.kpi.hl .k{color:#93A3B8}
.tablewrap{overflow-x:auto;border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{background:var(--ink2);color:#fff;font-weight:600;text-align:left;padding:9px 10px;white-space:nowrap;font-size:13px}
td{padding:9px 10px;border-top:1px solid var(--rule);white-space:nowrap}
tbody tr:nth-child(even):not(.total) td{background:#FAFBFD}
td.n,th.n{text-align:right}
tr.total td{background:#E4E9F0!important;font-weight:700;border-top:2px solid var(--ink2)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--blue-soft)!important}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:3px;padding:2px 7px;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:#B7E0C3}.pill.ng{background:var(--ng-soft);color:var(--ng);border-color:#F3C2BD}
.pill.wait{background:var(--wait-soft);color:var(--wait);border-color:#F1D39E}.pill.test{background:var(--test-soft);color:var(--test);border-color:#C9C6F3}
.badge-internal{background:#FFF4EC;color:#8A3307;border:1px dashed #F0A877;padding:8px 12px;font-size:13px;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--fg);min-height:44px}
.check input{width:22px;height:22px;min-height:0}
/* 판정 스탬프: 저장 결과 */
.stampcard{display:flex;gap:14px;align-items:center;background:var(--sheet);border:1px solid var(--rule);padding:12px 14px}
.stamp{flex:none;width:76px;height:76px;border-radius:50%;border:3px double currentColor;display:grid;place-items:center;transform:rotate(-8deg);font-weight:700;font-size:22px;line-height:1;text-align:center}
.stamp small{display:block;font-size:10px;font-weight:600;margin-top:3px}
.stamp.ok{color:var(--ok)}.stamp.ng{color:var(--ng)}.stamp.wait{color:var(--wait)}
.stampcard .txt{min-width:0;font-size:14px}
@media (prefers-reduced-motion:no-preference){.stamp{animation:press .35s cubic-bezier(.2,1.6,.4,1)}@keyframes press{from{transform:rotate(-8deg) scale(1.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}}
/* 로그인 */
.login{max-width:400px;width:100%;margin:6vh auto 0}
.login .tb{display:grid;grid-template-columns:1fr auto;border:1px solid var(--rule);font-size:12px;margin-top:4px}
.login .tb div{padding:6px 10px;border-right:1px solid var(--rule)}
.login .tb div:last-child{border-right:0;color:var(--muted)}
.panel>h2{padding-bottom:10px;border-bottom:1px solid var(--rule)}
.wordsketch{display:block;width:100%;max-width:400px;height:auto;margin:3vh auto 0;color:var(--ink)}
.wordsketch text{font-family:var(--sans);font-weight:700}
.wordsketch .ln{fill:none}
.wordsketch .fl{fill:#DCE6F5}
.chart{width:100%;height:auto}
@media (max-width:560px){.hide-sm{display:none}.tblock{display:none}}
</style>

<script>
"use strict";
const SB_URL = "https://ettopqmqnjzktdfygtuz.supabase.co";
const SB_KEY = "sb_publishable_2XOscbG2JvfZyCGKiwyj9g_8_4k5G-P";
const LOGIN_DOMAIN = "msolution.local";
const DEFECT_TYPES = ["스크래치","찍힘","긁힘","컬러이색","가스불량","오염","누락","이종","미성형","조립불량(핀삽입불량)","변형","기타"];
const LINES = ["KA4 G/BOX","CE1/CT1 G/BOX","SV1 G/BOX","SV1 UPR","GN7 G/BOX","SP3k G/BOX","밀링스코어링","SP3k PAB융착"];
const ROLE_KO = {admin:"관리자",quality:"품질",production:"생관",materials:"자재"};
const TABS = [
  {id:"material", label:"자재", roles:["admin","quality","production","materials"], ic:'<rect x="3" y="7" width="18" height="13" rx="1"/><path d="M3 11h18M9 7V4h6v3"/>'},
  {id:"incoming", label:"수입검사", roles:["admin","quality"], ic:'<path d="M9 4h6v3H9z"/><path d="M8 5H5v16h14V5h-3"/><path d="m9 14 2 2 4-5"/>'},

];
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n0 = v => (v===null||v===undefined||v==="") ? "-" : Number(v).toLocaleString("ko-KR");
const n1 = v => (v===null||v===undefined) ? "-" : Number(v).toLocaleString("ko-KR",{maximumFractionDigits:1});
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const monthRange = ym => { const [y,m]=ym.split("-").map(Number); const last=new Date(y,m,0).getDate(); return [`${ym}-01`,`${ym}-${String(last).padStart(2,"0")}`]; };

const WORD_SKETCH = `<svg class="wordsketch" viewBox="0 0 400 130" fill="none" stroke="currentColor" stroke-linecap="round" aria-label="엠솔루션" role="img">
  <g stroke="#2B4A7E" stroke-width=".7" opacity=".55"><path d="M4 92H396M10 40H392M2 66H398" stroke-dasharray="12 5 2 5"/><path d="M38 20V112M362 18V114" stroke-dasharray="3 4"/></g>
  <g stroke="#2B4A7E" stroke-width=".6" opacity=".35"><path d="M0 104L400 86M20 118L380 22"/></g>
  <text class="fl" x="200" y="91" text-anchor="middle" font-size="60" stroke-width=".9">엠솔루션</text>
  <text class="ln" x="202.2" y="92.4" text-anchor="middle" font-size="60" stroke-width=".45" opacity=".45" transform="rotate(-1.4 200 70)">엠솔루션</text>
  <text class="ln" x="201" y="91.6" text-anchor="middle" font-size="60" stroke-width=".45" opacity=".55" transform="rotate(-.6 200 70)">엠솔루션</text>
  <text class="ln" x="198.4" y="89.8" text-anchor="middle" font-size="60" stroke-width=".5" opacity=".6" transform="rotate(1 200 70)">엠솔루션</text>
  <g stroke="#E2580B" stroke-width="2.2"><path d="M60 102C140 98 260 99 342 101"/><path d="M66 106C150 103 250 104 330 105" stroke-width="1" opacity=".6"/></g>
  <text x="38" y="124" font-size="10" fill="#2B4A7E" stroke="none" font-weight="600" letter-spacing=".08em">M-SOLUTION · AUTOMOTIVE INTERIOR</text>
  <text x="362" y="124" font-size="10" fill="#2B4A7E" stroke="none" text-anchor="end">SKETCH No.01</text>
</svg>`;
/* ---------- 세션/인증 ---------- */
let session = null, me = null, current = null;
function loadSession(){ try{ session = JSON.parse(localStorage.getItem("qms_session")||"null"); }catch(e){ session=null; } }
function saveSession(s){ session=s; try{ s ? localStorage.setItem("qms_session",JSON.stringify(s)) : localStorage.removeItem("qms_session"); }catch(e){} }
async function authCall(grant, body){
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, {method:"POST", headers:{apikey:SB_KEY,"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description==="Invalid login credentials" ? "아이디 또는 비밀번호가 맞지 않습니다" : (j.error_description||j.msg||"로그인 실패"));
  return {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600)};
}
async function token(){
  if(!session) throw new Error("로그인이 필요합니다");
  if(session.expires_at - Date.now()/1000 < 60){
    try{ saveSession(await authCall("refresh_token",{refresh_token:session.refresh_token})); }
    catch(e){ saveSession(null); showLogin("세션이 만료되었습니다. 다시 로그인하세요."); throw e; }
  }
  return session.access_token;
}
const ERR_KO = {"Unauthorized":"이 기능을 사용할 권한이 없습니다","login required":"로그인이 필요합니다","not authorized":"이 기능을 사용할 권한이 없습니다"};
async function rpc(name, args={}){
  let r;
  try{
    r = await fetch(`${SB_URL}/rest/v1/rpc/${name}`, {method:"POST", headers:{apikey:SB_KEY, Authorization:`Bearer ${await token()}`, "Content-Type":"application/json"}, body:JSON.stringify(args)});
  }catch(e){ throw new Error("서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요."); }
  const j = await r.json().catch(()=>null);
  if(!r.ok){ const m = j?.message || `오류 ${r.status}`; throw new Error(ERR_KO[m] || m); }
  return j;
}
async function adminFn(body){
  const r = await fetch(`${SB_URL}/functions/v1/qms-admin-users`, {method:"POST", headers:{apikey:SB_KEY, Authorization:`Bearer ${await token()}`, "Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || `오류 ${r.status}`);
  return j;
}
function stampCard(el, r){
  const kind = r.ppm_status!=="확정" ? "wait" : (r.reject_qty>0 ? "ng" : "ok");
  const word = kind==="wait" ? "대기" : kind==="ng" ? "NG" : "OK";
  el.innerHTML = `<div class="stampcard" role="status"><div class="stamp ${kind}"><div>${word}<small>${kind==="wait"?"입고수량":"수입검사"}</small></div></div>
    <div class="txt"><b>저장 완료 #${r.id}</b>${r.record_kind==="TEST"?' <span class="pill test">시험</span>':""}<div class="code">${esc(r.material_code)}</div>
    <div class="muted">${esc(r.material_name)} · ${esc(r.supplier)}</div>
    <div>검사 ${n0(r.inspected_qty)}개 · 불량 ${n0(r.reject_qty)}개 · ${r.ppm!==null?`<b>${n1(r.ppm)} PPM</b>`:"입고수량 입력 후 PPM 확정"}</div></div></div>`;
}
function msg(el, type, text){ el.innerHTML = text ? `<div class="msg ${type}">${esc(text)}</div>` : ""; }

/* ---------- 로그인 ---------- */
function showLogin(note){
  me=null; $("#tabs").hidden=true; $("#btnLogout").hidden=true; $("#tblock").hidden=true; document.body.classList.add("is-login"); $("#whoami").textContent="품질관리 시스템";
  $("#app").innerHTML = `${WORD_SKETCH}<form class="panel login" id="fLogin" style="margin-top:12px">
    <div><h2 style="border:0;padding:0;font-size:22px">품질관리 시스템</h2>
    <div class="tb"><div>수입검사 · 공식 PPM · 공정불량</div><div>IATF 16949</div></div></div>
    <div id="lm">${note?`<div class="msg info">${esc(note)}</div>`:""}</div>
    <label>아이디 (또는 이메일)<input id="lid" autocomplete="username" autocapitalize="none" required></label>
    <label>비밀번호<input id="lpw" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" id="lbtn">로그인</button>
    <div class="muted">계정은 관리자가 개인별로 발급합니다.</div></form>`;
  $("#fLogin").onsubmit = async e => {
    e.preventDefault(); const b=$("#lbtn"); b.disabled=true; msg($("#lm"),"","");
    let id = $("#lid").value.trim(); if(!id.includes("@")) id = `${id.toLowerCase()}@${LOGIN_DOMAIN}`;
    try{ saveSession(await authCall("password",{email:id,password:$("#lpw").value})); await boot(); }
    catch(err){ msg($("#lm"),"err",err.message); b.disabled=false; }
  };
}
$("#btnLogout").onclick = async () => {
  try{ await fetch(`${SB_URL}/auth/v1/logout`,{method:"POST",headers:{apikey:SB_KEY,Authorization:`Bearer ${session?.access_token}`}}); }catch(e){}
  saveSession(null); showLogin("로그아웃되었습니다.");
};
async function boot(){
  loadSession(); if(!session) return showLogin();
  try{ me = await rpc("qms_me"); }catch(e){ saveSession(null); return showLogin(e.message); }
  if(!me.active){ $("#app").innerHTML=`<div class="panel"><div class="msg err">계정이 아직 승인되지 않았습니다. 관리자에게 권한 등록을 요청하세요.</div></div>`; $("#btnLogout").hidden=false; return; }
  const uname=(me.email||"").replace("@"+LOGIN_DOMAIN,"");
  $("#whoami").textContent = `품질관리 시스템 · ${ROLE_KO[me.role]||me.role}`;
  $("#tblock").innerHTML = `<div>사용자</div><div>${esc(uname)}</div><div>권한</div><div>${esc(ROLE_KO[me.role]||me.role)}</div><div>일자</div><div>${today()}</div>`;
  $("#tblock").hidden=false; $("#btnLogout").hidden=false; document.body.classList.remove("is-login");
  const mine = TABS.filter(t=>t.roles.includes(me.role));
  $("#tabs").innerHTML = mine.map(t=>`<button data-t="${t.id}"><svg viewBox="0 0 24 24" aria-hidden="true">${t.ic}</svg>${t.label}</button>`).join("");
  $("#tabs").hidden=false;
  $("#tabs").onclick = e => { const b=e.target.closest("button"); if(b) go(b.dataset.t); };
  let saved=null; try{ saved=localStorage.getItem("qms_tab"); }catch(e){}
  go(mine.some(t=>t.id===saved) ? saved : mine[0].id);
}
function go(id, arg){
  current=id; try{ localStorage.setItem("qms_tab",id); }catch(e){}
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===id));
  ({material:viewMaterial, incoming:viewIncoming, inlist:viewInList, ppm:viewPpm, line:viewLine, users:viewUsers})[id](arg);
  window.scrollTo(0,0);
}

/* ---------- 자재 선택 컴포넌트 ---------- */
function materialPicker(host, onPick, initial){
  host.innerHTML = `<label>자재 (품번·품명·차종·업체 검색)<input class="mq" placeholder="예: N1000, 글로브, GN7, 니프코" autocomplete="off"></label>
    <div class="sel" hidden></div><div class="results" hidden></div>`;
  const q=$(".mq",host), sel=$(".sel",host), res=$(".results",host); let t=null, last=[];
  const show = m => { sel.hidden=false; sel.innerHTML=`<div><b class="code">${esc(m.material_code)}</b> ${esc(m.material_name)}<div class="muted">${esc(m.vehicle)} · ${esc(m.supplier)} ${m.color_code?"· "+esc(m.color_code):""}</div></div><button type="button" class="btn ghost">변경</button>`;
    $("button",sel).onclick=()=>{ sel.hidden=true; q.parentElement.hidden=false; onPick(null); q.focus(); }; q.parentElement.hidden=true; res.hidden=true; };
  q.oninput = () => { clearTimeout(t); t=setTimeout(async()=>{
    const v=q.value.trim(); if(!v){res.hidden=true;return;}
    try{ last = await rpc("qms_material_search",{p_q:v,p_limit:30}); }catch(e){ res.hidden=false; res.innerHTML=`<div class="msg err">${esc(e.message)}</div>`; return; }
    res.hidden=false;
    res.innerHTML = last.length ? last.map((m,i)=>`<button type="button" data-i="${i}"><b class="code">${esc(m.material_code)}</b> ${esc(m.material_name)}<div class="muted">${esc(m.vehicle)} · ${esc(m.supplier)}</div></button>`).join("") : `<div class="muted" style="padding:10px">검색 결과가 없습니다</div>`;
  },250); };
  res.onclick = e => { const b=e.target.closest("button[data-i]"); if(!b) return; const m=last[b.dataset.i]; show(m); onPick(m); };
  if(initial) show(initial);
}

/* ---------- 자재 조회 ---------- */
async function viewMaterial(){
  $("#app").innerHTML = `<section class="panel"><h2>자재 마스터</h2>
    <label>검색<input id="mq" placeholder="품번·품명·차종·업체" autocomplete="off"></label>
    <div id="mm"></div><div class="tablewrap"><table><thead><tr><th>차종</th><th>품번</th><th>품명</th><th>업체</th><th class="hide-sm">품목</th></tr></thead><tbody id="mt"></tbody></table></div>
    <div class="muted" id="mc"></div></section>`;
  let t=null;
  const load = async () => {
    try{ const rows = await rpc("qms_material_search",{p_q:$("#mq").value.trim(),p_limit:300});
      $("#mt").innerHTML = rows.map(m=>`<tr><td>${esc(m.vehicle)}</td><td class="code">${esc(m.material_code)}</td><td>${esc(m.material_name)}</td><td>${esc(m.supplier)}</td><td class="hide-sm">${esc(m.item)}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">결과 없음</td></tr>`;
      $("#mc").textContent = `${n0(rows.length)}건 표시`;
    }catch(e){ msg($("#mm"),"err",e.message); }
  };
  $("#mq").oninput = ()=>{ clearTimeout(t); t=setTimeout(load,250); };
  load();
}

/* ---------- 수입검사 등록/수정 ---------- */
function viewIncoming(edit){
  let mat = edit ? {id:edit.material_id, material_code:edit.material_code, material_name:edit.material_name, vehicle:edit.vehicle, supplier:edit.supplier, color_code:edit.color_code} : null;

function downloadCsv(name, head, rows){
  const c = v => { const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  const blob = new Blob(["﻿"+[head,...rows].map(r=>r.map(c).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
}

async function viewPpm(){
  const ym = today().slice(0,7);
  $("#app").innerHTML = `<section class="panel"><h2>공식 수입검사 PPM</h2>
    <div class="muted">기준: 수입검사 실적 중 입고수량 확정 건만 집계 · 시험용 기록과 라인 공정불량은 제외 · PPM = 불량수량 ÷ 검사수량 × 1,000,000</div>
    <div class="row"><label>월<input type="month" id="ym" value="${ym}"></label><label>또는 시작<input type="date" id="pf"></label><label>종료<input type="date" id="pt"></label></div>
    <div class="btns"><button class="btn" id="pq">집계</button><button class="btn ghost" id="pcsv">CSV 내보내기</button></div><div id="pmsg"></div></section>
    <div class="kpis" id="kpi"></div>
    <section class="panel"><h2>업체별 PPM</h2><div id="chart"></div>
    <div class="tablewrap"><table><thead><tr><th>업체</th><th class="n">검사</th><th class="n">불량</th><th class="n">PPM</th></tr></thead><tbody id="pt2"></tbody></table></div></section>`;
  let data=null;
  const run = async () => {
    let f=$("#pf").value, t=$("#pt").value; if(!f||!t) [f,t]=monthRange($("#ym").value);
    try{ data = await rpc("qms_incoming_ppm_summary",{p_from:f,p_to:t}); }catch(e){ return msg($("#pmsg"),"err",e.message); }
    msg($("#pmsg"),"info",`조회기간 ${f} ~ ${t}`);
    $("#kpi").innerHTML = [["공식 PPM",n1(data.ppm)+(data.ppm!==null?" PPM":""),1],["검사수량",n0(data.total_inspected)+" 개"],["불량수량",n0(data.total_reject)+" 개"],["검사건수",n0(data.inspection_count)+" 건"]]
      .map(([k,v,h])=>`<div class="kpi ${h?"hl":""}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
    const s = (data.suppliers||[]).slice().sort((a,b)=>(b.ppm||0)-(a.ppm||0));
    $("#pt2").innerHTML = s.map((x,i)=>`<tr><td>${i+1}. ${esc(x.supplier)}${i===0&&x.reject>0?' <span class="pill ng">워스트</span>':""}</td><td class="n">${n0(x.inspected)}</td><td class="n">${n0(x.reject)}</td><td class="n">${n1(x.ppm)}</td></tr>`).join("")
      + `<tr class="total"><td>합계</td><td class="n">${n0(data.total_inspected)}</td><td class="n">${n0(data.total_reject)}</td><td class="n">${n1(data.ppm)}</td></tr>`;
    $("#chart").innerHTML = s.length ? barChart(s.slice(0,10)) : `<div class="muted">해당 기간 확정된 수입검사 실적이 없습니다.</div>`;
  };
  $("#pq").onclick=run;
  $("#pcsv").onclick=()=>{ if(!data) return; downloadCsv(`공식PPM_${data.from}_${data.to}.csv`,["업체","검사수량","불량수량","PPM"],(data.suppliers||[]).map(x=>[x.supplier,x.inspected,x.reject,x.ppm])); };
  run();
}
function barChart(s){
  const W=640, rowH=30, padL=120, padR=70, H=s.length*rowH+10, max=Math.max(...s.map(x=>x.ppm||0),1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="업체별 PPM">${s.map((x,i)=>{ const w=((x.ppm||0)/max)*(W-padL-padR), y=i*rowH+5;
    return `<text x="${padL-8}" y="${y+18}" text-anchor="end" font-size="13" fill="#334155">${esc(x.supplier).slice(0,12)}</text>
    <rect x="${padL}" y="${y+4}" width="${Math.max(w,1)}" height="20" rx="3" fill="${i===0&&x.reject>0?"#EA580C":"#2563EB"}"></rect>
    <text x="${padL+Math.max(w,1)+6}" y="${y+18}" font-size="12" fill="#0F172A">${n1(x.ppm)}</text>`; }).join("")}</svg>`;
}

    try{ await adminFn({action:"set_active",user_id:b.dataset.u,active:b.dataset.a==="1"}); list(); }catch(err){ msg($("#um"),"err",err.message); b.disabled=false; } };
  $("#fU").onsubmit = async e => { e.preventDefault(); $("#ubtn").disabled=true;
    try{ const r = await adminFn({action:"create",name:$("#un").value,login:$("#ul").value,password:$("#up").value,role:$("#ur").value});
      $("#fU").reset(); msg($("#um"),"ok",`발급 완료: 아이디 ${r.login} (${ROLE_KO[r.role]}). 초기 비밀번호는 본인에게 직접 전달하세요.`); list(); }
    catch(err){ msg($("#um"),"err",err.message); } $("#ubtn").disabled=false; };
  list();
}

boot();
</script>
</body>
</html>
