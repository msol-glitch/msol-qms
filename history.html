<style>
/* 차종 이력장 (시험본 v0.4, 2026-11-17) — QMS와 같은 서버·같은 로그인·같은 기록표(qms.shopfloor_events)를 쓴다. 새 DB 표 없음. */
:root{--ink:#123B2F;--ink2:#1B4A3C;--brass:#B49A5E;--paper:#F7F5EF;--rule:#E4E2DA;--fg:#18201D;--muted:#66706B;
  --ok:#2F6B4F;--ok-soft:#E5EFE8;--ng:#9E2B25;--ng-soft:#F6E6E3;--wait:#8A6420;--wait-soft:#F4ECDC;--test:#4B4F8C;--test-soft:#E9E9F2;
  --sans:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.55 var(--sans);color:var(--fg);background:var(--paper);padding-bottom:40px}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:10;background:#fff;color:var(--ink);border-bottom:4px solid var(--ink);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;box-shadow:0 2px 0 var(--brass)}
.brand{display:flex;flex-direction:column;gap:2px}.brand img{height:30px;width:auto;align-self:flex-start}.brand b{font-size:19px;letter-spacing:-.02em;color:var(--ink)}
.hb{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hb small{display:block;font-size:12px;color:var(--muted)}
.hb .sp{flex:1}
.hb button{background:#fff;color:var(--ink);border:1px solid #C9C6B8;border-radius:4px;padding:7px 10px;font:inherit;font-size:12.5px}
main{max-width:880px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.panel{background:#fff;border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:2px;padding:14px;display:flex;flex-direction:column;gap:12px}
h2{font-size:16px;margin:0}
.lab{font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:15px;min-height:46px;padding:8px 14px;border:1px solid #C9C6B8;background:#fff;border-radius:4px;color:var(--fg)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kinds button{font:inherit;min-height:64px;border:1px solid #C9C6B8;background:#fff;border-radius:4px;text-align:left;padding:10px 12px}
.kinds button b{display:block;font-size:16px}.kinds button span{font-size:12px;color:var(--muted)}
.kinds button.on{background:var(--ink);border-color:var(--ink);color:#fff}.kinds button.on span{color:#C8D2CD}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.tabs button{font:inherit;font-weight:700;min-height:46px;border:0;background:#fff;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:#fff;border:1px solid #B9C4BE;border-radius:4px;padding:10px 12px;width:100%;min-height:46px}
textarea{min-height:120px;resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-weight:500;min-height:40px}
.check input{width:22px;height:22px;min-height:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:4px;padding:12px 16px;min-height:50px;background:var(--ink);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn.rec{background:var(--ng)}
.btn:disabled{opacity:.55}
.msg{padding:10px 12px;border-radius:4px;font-size:14px}.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.err{background:var(--ng-soft);color:var(--ng)}.msg.info{background:var(--wait-soft);color:var(--wait)}
.muted{color:var(--muted);font-size:13px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .t{position:relative}.thumbs img{width:72px;height:72px;object-fit:cover;border:1px solid var(--rule);border-radius:3px}
.thumbs .t button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ng);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--rule)}
.kpi{padding:8px 6px;text-align:center;border-right:1px solid var(--rule)}.kpi:last-child{border-right:0}
.kpi .k{font-size:11.5px;color:var(--muted)}.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi.hl{background:var(--ink);color:#fff}.kpi.hl .k{color:#A8B2AD}
.item{border:1px solid var(--rule);border-left:4px solid var(--brass);border-radius:2px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.item.불량{border-left-color:var(--ng)}.item.경험·노하우{border-left-color:var(--ok)}.item.변동점\(4M\){border-left-color:var(--wait)}
.item .hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.item .tx{white-space:pre-wrap;word-break:break-word;font-size:15px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:3px;padding:1px 7px}
.pill.불량{background:var(--ng-soft);color:var(--ng)}.pill.경험·노하우{background:var(--ok-soft);color:var(--ok)}.pill.변동점\(4M\){background:var(--wait-soft);color:var(--wait)}.pill.기타,.pill.etc{background:#EEE;color:#555}.pill.test{background:var(--test-soft);color:var(--test)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:99}#lightbox img{max-width:100%;max-height:100%}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.click{cursor:pointer}.click:hover{background:#FAF8F2}.tx.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.big{display:flex;flex-direction:column;gap:10px}.big img{width:100%;height:auto;border:1px solid var(--rule);border-radius:3px;cursor:zoom-in}
.mini{font:inherit;font-size:13px;border:1px solid #C9C6B8;background:#fff;border-radius:3px;padding:5px 10px;color:var(--ink);cursor:pointer;margin-top:4px}.mwrap{display:flex;flex-direction:column;gap:4px}
.note{background:#F4F1E8;border-radius:3px;padding:8px 10px;white-space:pre-wrap}
.paste{background:#EEF4F0;border:1px dashed var(--ok);color:var(--ink);padding:8px 12px;border-radius:3px;font-size:13.5px}
@media(min-width:900px){main,.hb{max-width:1180px}}
.tw{overflow-x:auto;border:1px solid var(--rule)}.ht{border-collapse:collapse;width:100%;font-size:14px}
.ht th{background:var(--ink);color:#fff;text-align:left;padding:10px;font-weight:600;white-space:nowrap}.ht th.n,.ht td.n{text-align:right}
.ht td{padding:10px;border-top:1px solid var(--rule);white-space:nowrap}.ht td.ell{max-width:420px;overflow:hidden;text-overflow:ellipsis}
.ht tbody tr{cursor:pointer}.ht tbody tr:nth-child(even) td{background:#FAF9F5}.ht tbody tr:hover td{background:#EEF4F0}.mono{font-variant-numeric:tabular-nums;color:var(--muted)}
.trial{background:#FFF7E6;border:1px dashed #E2B35A;color:#7A5410;padding:8px 12px;font-size:13px;border-radius:3px}
</style>
</head>

function saveSession(s){session=s;try{s?localStorage.setItem("qms_session",JSON.stringify(s)):localStorage.removeItem("qms_session");}catch(e){}}
async function authCall(g,body){
  const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=${g}`,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const m=j.error_description||j.msg||j.message||"";throw new Error(j.error_code==="invalid_credentials"||/invalid login/i.test(m)?"아이디 또는 비밀번호가 맞지 않습니다":(m||"로그인 실패"));}
  return {access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600)};
}
async function token(){
  if(!session) throw new Error("로그인이 필요합니다");
  if(session.expires_at-Date.now()/1000<60){try{saveSession(await authCall("refresh_token",{refresh_token:session.refresh_token}));}catch(e){saveSession(null);showLogin("로그인이 만료되었습니다. 다시 로그인하세요.");throw e;}}
  return session.access_token;
}
async function rpc(name,args={}){
  const tk=await token(); /* 로그인 만료는 여기서 따로 처리 — 인터넷 오류로 잘못 표시되지 않게 */
  let r;try{r=await fetch(`${SB_URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:`Bearer ${tk}`,"Content-Type":"application/json"},body:JSON.stringify(args)});}
  catch(e){throw new Error("서버에 연결할 수 없습니다. 인터넷(LTE) 연결을 확인하세요.");}
  const j=await r.json().catch(()=>null);
  if(!r.ok){const m=j?.message||`오류 ${r.status}`;throw new Error(m==="Unauthorized"?"이 기능을 쓸 권한이 없습니다 (관리자에게 권한 요청)":m);}
  return j;
}
async function upload(path,blob,type){
  const r=await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:`Bearer ${await token()}`,"Content-Type":type,"x-upsert":"false"},body:blob});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||`업로드 오류 ${r.status}`);}
}
const cache={};
async function fileUrl(p){if(cache[p])return cache[p];const r=await fetch(`${SB_URL}/storage/v1/object/authenticated/${BUCKET}/${p}`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${await token()}`}});if(!r.ok)throw new Error("열람 불가");return cache[p]=URL.createObjectURL(await r.blob());}
/* 사진 줄이기: 큰 폰 사진(5천만 화소 등)도 되도록 ① createImageBitmap ② Image ③ 원본 그대로(10MB 이하 JPG·PNG·WEBP) 순서로 시도 */
const OK_TYPES=["image/jpeg","image/png","image/webp"];
function toJpeg(src,w,h,max,q){const s=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);return new Promise((ok,no)=>c.toBlob(b=>b&&b.size>0?ok(b):no(new Error("변환 실패")),"image/jpeg",q));}
async function shrink(file,max=1600,q=.8){
  if(window.createImageBitmap){try{const bm=await createImageBitmap(file);try{return await toJpeg(bm,bm.width,bm.height,max,q);}finally{bm.close&&bm.close();}}catch(e){}}
  try{return await new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{toJpeg(i,i.naturalWidth,i.naturalHeight,max,q).then(ok,no).finally(()=>URL.revokeObjectURL(u));};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error("열 수 없음"));};i.src=u;});}catch(e){}
  if(OK_TYPES.includes(file.type)&&file.size<=10*1024*1024) return file;
  throw new Error(`이 사진은 올릴 수 없습니다 (${file.type||"형식 모름"}, ${(file.size/1048576).toFixed(1)}MB). 휴대폰 카메라 설정에서 '고효율(HEIC)' 대신 JPG로 찍거나, 화면 캡처로 다시 올려주세요.`);
}

  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`오류 ${r.status}`);return j;
}

function jwtSub(){try{return JSON.parse(atob(session.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).sub;}catch(e){return null;}}
/* PC: 스크린샷 찍고 Ctrl+V (또는 파일 끌어놓기) → 지금 화면의 첨부칸에 바로 들어감 */
let pasteTarget=null;
const imgFiles=list=>[...(list||[])].filter(f=>f&&/^image\//.test(f.type));
document.addEventListener("paste",e=>{if(!pasteTarget)return;const fs=imgFiles([...(e.clipboardData?.items||[])].map(i=>i.kind==="file"?i.getAsFile():null));if(fs.length){e.preventDefault();pasteTarget(fs);}});
document.addEventListener("dragover",e=>{if(pasteTarget)e.preventDefault();});
document.addEventListener("drop",e=>{if(!pasteTarget)return;e.preventDefault();const fs=imgFiles(e.dataTransfer?.files);if(fs.length)pasteTarget(fs);});
const MAX_FILES=10;
const IS_PC=matchMedia("(pointer:fine)").matches;
const WIDE=matchMedia("(min-width:900px)").matches;
function jwtMeta(){try{const b=atob(session.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"));return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))).user_metadata||{};}catch(e){return {};}}
function showChangePw(){
  $("#app").innerHTML=`<form class="panel" id="fc"><h2>내 비밀번호 정하기</h2><div class="muted">처음 들어오셨습니다. 앞으로 쓸 비밀번호를 정하세요 (8자 이상).</div>

  $("#fc").onsubmit=async e=>{e.preventDefault();const cm=$("#cm"),p1=$("#p1").value;
    if(p1.length<8) return msg(cm,"err","8자 이상으로 정하세요");if(p1!==$("#p2").value) return msg(cm,"err","두 비밀번호가 다릅니다");
    if(/^ms\d{6}$/.test(p1)) return msg(cm,"err","초기 비밀번호와 다른 것으로 정하세요");
    $("#cb").disabled=true;

      const j=await r.json().catch(()=>({}));if(!r.ok) throw new Error(/weak|short|least/i.test(j.msg||j.message||"")?"비밀번호가 너무 쉽습니다. 다른 것으로 정하세요":(j.msg||j.message||"변경 실패"));
      saveSession(await authCall("refresh_token",{refresh_token:session.refresh_token}));await boot();}
    catch(err){msg(cm,"err",err.message);$("#cb").disabled=false;}};
}

let tab="write";
async function boot(){
  if(!session) return showLogin();

  if(!me||!me.role) return showLogin("이 계정은 QMS 사용자 등록이 안 되어 있습니다. 관리자에게 요청하세요.");
  if(!["admin","quality","production"].includes(me.role)) return showLogin("이 계정 권한으로는 이력장을 쓸 수 없습니다.");
  if(jwtMeta().must_change) return showChangePw();
  $("#who").textContent=`${jwtMeta().name||(me.email||"").split("@")[0]} `;$("#out").hidden=false;$("#staff").hidden=me.role!=="admin";$("#bk").hidden=me.role!=="admin";render();
}
function render(){
  pasteTarget=null;
  $("#app").innerHTML=`<div class="panel" style="gap:8px"><div class="lab">차종</div><div class="chips" id="vc">${VEHS.map(v=>`<button type="button" data-v="${esc(v)}" class="${v===veh?"on":""}">${esc(v)}</button>`).join("")}</div></div>

/* ---------- 기록하기: 차종 → 유형 → 말하거나 쳐서 저장 ---------- */
function viewWrite(){
  const lines=veh==="공통"?ALL_LINES:VEH[veh];
  let kind=null, line=lines.includes(store.get("hist_line_"+veh))?store.get("hist_line_"+veh):lines[0], photos=[], audio=null, rec=null, timer=null;
  $("#body").innerHTML=`<form class="panel" id="fw">
    <div class="lab">무슨 일인가요?</div>
    <div class="kinds" id="kd">${KINDS.map(k=>`<button type="button" data-v="${esc(k.v)}"><b>${k.label}</b></button>`).join("")}</div>

    <label>내용 <span class="muted" style="font-weight:400">(키보드 🎤 누르고 말해도 됩니다)</span>
      <textarea id="tx" maxlength="4900" placeholder="예) 우측 클립부 긁힘 반복. 사출 지그 모서리 닿는 것 확인, 테이프 보강 후 재발 없음"></textarea></label>
    <label class="check"><input type="checkbox" id="past"> 예전 일 옮겨 적기 (카톡·사진)</label>
    <div class="row" id="pastbox" hidden>
      <label>그 일이 있었던 날<input type="date" id="pd" max="${ymd(new Date())}"></label>
      <label>어디서 옮겨 왔나<select id="ps"><option>카톡</option><option>사진</option><option>기억</option><option>기타 문서</option></select></label>
    </div>
    <div class="row">
      <label class="btn ghost" style="flex-direction:row;justify-content:center;align-items:center;color:var(--ink)">📷 사진<input type="file" id="pf" accept="image/*" multiple class="vh"></label>
      <button type="button" class="btn ghost" id="rb">🎤 녹음</button>
    </div>
    ${IS_PC?`<div class="paste">💡 PC: 스크린샷 찍고 <b>Ctrl+V</b> 하면 여기 바로 붙습니다 (파일 끌어놓기도 됨)</div>`:""}<div id="pm"></div><div class="thumbs" id="th"></div><div id="au"></div>
    <details class="muted"><summary>기타 설정</summary><label class="check"><input type="checkbox" id="tst"> 연습용 기록 (집계에서 빠짐)</label></details>
    <div id="wm"></div>
    <button class="btn" id="sv">저장</button>
  </form>`;
  $("#kd").onclick=e=>{const b=e.target.closest("button");if(!b)return;kind=b.dataset.v;[...$("#kd").children].forEach(x=>x.classList.toggle("on",x===b));};
  $("#ln").onclick=e=>{const b=e.target.closest("button");if(!b)return;line=b.dataset.v;store.set("hist_line_"+veh,line);[...$("#ln").children].forEach(x=>x.classList.toggle("on",x===b));};
  $("#past").onchange=e=>{$("#pastbox").hidden=!e.target.checked;};
  const drawTh=()=>{$("#th").innerHTML=photos.map((p,i)=>`<div class="t"><img src="${p.url}" alt="사진${i+1}"><button type="button" data-i="${i}" aria-label="삭제">×</button></div>`).join("");};
  $("#th").onclick=e=>{const b=e.target.closest("button[data-i]");if(!b)return;const [p]=photos.splice(+b.dataset.i,1);URL.revokeObjectURL(p.url);drawTh();};
  const addFiles=async fs=>{fs=fs.slice(0,MAX_FILES-photos.length);if(!fs.length) return msg($("#pm"),"err",`사진은 ${MAX_FILES}장까지`);msg($("#pm"),"info","사진 처리 중…");
    let bad="";for(const f of fs){try{const b=await shrink(f,2560,.9);photos.push({blob:b,url:URL.createObjectURL(b),type:b.type||"image/jpeg"});}catch(err){bad=err.message;}}drawTh();msg($("#pm"),bad?"err":"ok",bad||`사진 ${photos.length}장 붙음 — 유형 고르고 저장`);};

    rec.onstop=()=>{clearInterval(timer);st.getTracks().forEach(t=>t.stop());const mt=(rec.mimeType||type||"audio/webm").split(";")[0];if(audio)URL.revokeObjectURL(audio.url);const bl=new Blob(ch,{type:mt});audio={blob:bl,mime:mt,url:URL.createObjectURL(bl)};b.textContent="🎤 다시 녹음";b.classList.remove("rec");drawAu();};

      id=r.id;const paths=[];
      for(let i=0;i<photos.length;i++){b.textContent=`사진 올리는 중 ${i+1}/${photos.length}`;const ty=photos[i].type||"image/jpeg";const ext={"image/png":"png","image/webp":"webp"}[ty]||"jpg";const p=`${r.uid}/sf/${id}/${Date.now()}_${i+1}.${ext}`;await upload(p,photos[i].blob,ty);paths.push(p);}
      if(audio){b.textContent="음성 올리는 중";const p=`${r.uid}/sf/${id}/${Date.now()}_voice.${AUDIO_EXT[audio.mime]||"webm"}`;await upload(p,audio.blob,audio.mime);paths.push(p);}
      if(paths.length) await rpc("qms_history_attach",{p_event_id:id,p_paths:paths});
      photos.forEach(p=>URL.revokeObjectURL(p.url));if(audio)URL.revokeObjectURL(audio.url);
      viewWrite();msg($("#wm"),"ok",`저장 #${id} · ${veh} · ${KIND_KO[kind]} · ${line}${paths.length?` · 첨부 ${paths.length}`:""}`);
    }catch(err){msg(wm,"err",id?`기록 #${id}은 저장됐지만 첨부 실패: ${err.message}`:"저장 실패: "+err.message);b.disabled=false;b.textContent="저장";}
  };
}

      <label>검색<input id="q" placeholder="단어로 찾기 (예: 긁힘, 지그)"></label></div>
    <label class="check"><input type="checkbox" id="it"> 연습용 기록도 보기</label>
    <div class="kpis" id="kp"></div>
    <div class="chips" id="kf"><button type="button" data-v="" class="on">전체</button>${KINDS.map(k=>`<button type="button" data-v="${esc(k.v)}">${k.label}</button>`).join("")}</div>
    <div id="lm"></div><div id="ls" style="display:flex;flex-direction:column;gap:8px"></div></div>`;
  const mine=()=>true; /* 차종 거르기는 서버(qms_history_list)에서 */
  const draw=()=>{const q=$("#q").value.trim().toLowerCase();
    const base=rows.filter(mine);const cnt=k=>base.filter(r=>k?r.event_category===k:true).length;
    $("#kp").innerHTML=`<div class="kpi hl"><div class="k">${esc(veh)} 전체</div><div class="v">${cnt("").toLocaleString("ko-KR")}건</div></div>`+KINDS.map(k=>`<div class="kpi"><div class="k">${k.label}</div><div class="v">${cnt(k.v).toLocaleString("ko-KR")}</div></div>`).join("");
    const v=base.filter(r=>(!kf||r.event_category===kf)&&(!q||`${r.raw_text} ${r.line_name} ${r.supplier||""} ${r.defect_type||""}`.toLowerCase().includes(q)));
    if(WIDE){ $("#ls").innerHTML=v.length?`<div class="tw"><table class="ht"><thead><tr><th>번호</th><th>날짜</th><th>차종 / 라인</th><th>구분</th><th>내용</th><th class="n">자료</th><th>작성</th><th>상태</th></tr></thead><tbody>${v.map(r=>{const c=KIND_KO[r.event_category]?r.event_category:"etc";
        return `<tr class="item-row" data-id="${r.id}"><td class="mono">#${r.id}</td><td>${new Date(r.occurred_at).toLocaleDateString("ko-KR",{year:"2-digit",month:"2-digit",day:"2-digit"})}</td><td>${esc(r.vehicle||veh)} · ${esc(r.line_name)}</td>
        <td><span class="pill ${esc(c)}">${esc(KIND_KO[r.event_category]||r.event_category)}</span></td><td class="ell">${esc(r.raw_text)}</td><td class="n">${r.media.length?"📎 "+r.media.length:""}${r.notes?.length?" 💬 "+r.notes.length:""}</td>
        <td>${esc(r.reporter_name||r.reporter)}</td><td>${r.record_kind==="TEST"?'<span class="pill test">연습</span> ':""}${r.edited||r.corrections?'<span class="pill etc">정정됨</span>':""}</td></tr>`;}).join("")}</tbody></table></div>`:`<div class="muted">기록이 없습니다.</div>`; return; }
    $("#ls").innerHTML=v.length?v.map(r=>{const c=KIND_KO[r.event_category]?r.event_category:"etc";
      const img=r.media.filter(m=>!(m.mime||"").startsWith("audio"));
      return `<div class="item ${esc(c)} click" data-id="${r.id}"><div class="hd"><b>#${r.id}</b>${fmt(r.occurred_at)} · ${esc(r.line_name)} <span class="pill ${esc(c)}">${esc(KIND_KO[r.event_category]||r.event_category)}</span>${r.record_kind==="TEST"?'<span class="pill test">연습</span>':""} · ${esc(r.reporter_name||r.reporter)}</div>
      <div style="display:flex;gap:10px">${img.length?`<div class="thumbs"><img data-path="${esc(img[0].path)}" alt="첨부"></div>`:""}<div class="tx clip">${esc(r.raw_text)}</div></div>
      <div class="muted">${r.media.length?`📎 자료 ${r.media.length}`:""}${r.notes?.length?` · 💬 덧붙임 ${r.notes.length}`:""}${r.edited||r.corrections?" · 정정됨":""} <b style="color:var(--ink)">› 열기</b></div></div>`;}).join(""):`<div class="muted">기록이 없습니다.</div>`;
    fill($("#ls"),true);};
  const load=async()=>{msg($("#lm"),"info","불러오는 중…");
    try{rows=await rpc("qms_history_list",{p_vehicle:veh==="공통"?null:veh,p_lines:veh==="공통"?null:VEH[veh],p_from:ymd(Date.now()-$("#per").value*864e5),p_to:ymd(new Date()),p_include_test:$("#it").checked,p_limit:1000});msg($("#lm"),"","");draw();}
    catch(e){msg($("#lm"),"err",e.message);}};
  $("#kf").onclick=e=>{const b=e.target.closest("button");if(!b)return;kf=b.dataset.v;[...$("#kf").children].forEach(x=>x.classList.toggle("on",x===b));draw();};
  $("#ls").onclick=e=>{const it=e.target.closest(".item[data-id],tr[data-id]");if(!it)return;const r=rows.find(x=>x.id==it.dataset.id);if(r)viewDetail(r,load);};
  $("#q").oninput=draw;$("#per").onchange=load;$("#it").onchange=load;load();
}
async function fill(host,noZoom){
  for(const el of host.querySelectorAll("[data-path]")){try{el.src=await fileUrl(el.dataset.path);if(el.tagName==="IMG"&&!noZoom)el.onclick=()=>{const d=document.createElement("div");d.id="lightbox";d.innerHTML=`<img src="${el.src}" alt="">`;d.onclick=()=>d.remove();document.body.appendChild(d);};}catch(e){el.replaceWith(Object.assign(document.createElement("span"),{className:"muted",textContent:"열람 불가"}));}}
}
/* ---------- 상세: 기본 내용 + 모든 사진 + 덧붙이기(매핑) + 정정 ---------- */
/* 정정 원칙: 지우지 않는다. 화면엔 최신·유효 자료만, 원래 내용·뺀 자료는 '정정 이력'에 사유와 함께 남는다. */
function viewDetail(r,reload){
  const c=KIND_KO[r.event_category]?r.event_category:"etc";let add=[];
  const boss=["admin","quality"].includes(me.role);
  const canText=boss||r.mine;
  const refresh=async(note)=>{const rows=await rpc("qms_history_list",{p_vehicle:veh==="공통"?null:veh,p_lines:veh==="공통"?null:VEH[veh],p_from:ymd(new Date(r.occurred_at)),p_to:ymd(new Date()),p_include_test:true,p_limit:1000});
    viewDetail(rows.find(x=>x.id===r.id)||r,reload);if(note)msg($("#dm0"),"ok",note);};
  const ask=t=>{const v=prompt(t+"\n정정 사유를 적어주세요 (2자 이상)");return v&&v.trim().length>=2?v.trim():null;};
  $("#body").innerHTML=`<div class="panel">
    <button type="button" class="btn ghost" id="dback">← 목록으로</button><div id="dm0"></div>
    <div class="hd muted"><b style="color:var(--fg)">#${r.id}</b> · ${fmt(r.occurred_at)} · ${esc(r.vehicle||veh)} · ${esc(r.line_name)} <span class="pill ${esc(c)}">${esc(KIND_KO[r.event_category]||r.event_category)}</span> · 작성 ${esc(r.reporter_name||r.reporter)}${r.edited?' <span class="pill etc">정정됨</span>':""}</div>
    <div id="tbox"><div class="tx" style="font-size:16px;white-space:pre-wrap">${esc(r.raw_text)}</div>
      ${canText?`<button type="button" class="mini" id="tedit">✏️ 본문 정정</button>`:""}</div>
    ${r.media.length?`<div class="big">${r.media.map(m=>`<div class="mwrap">${(m.mime||"").startsWith("audio")?`<audio controls data-path="${esc(m.path)}" style="width:100%"></audio>`:`<img data-path="${esc(m.path)}" alt="첨부">`}
      ${boss||r.mine||m.mine?`<button type="button" class="mini" data-hide="${esc(m.path)}">이 자료 빼기</button>`:""}</div>`).join("")}</div>`:`<div class="muted">첨부 자료 없음</div>`}
    ${(r.notes||[]).map(n=>`<div class="note" data-nid="${n.id}"><div class="muted">💬 ${esc(n.by)} · ${fmt(n.at)}</div><div class="nt">${esc(n.note)}</div>
      ${boss||n.mine?`<button type="button" class="mini" data-nedit="${n.id}">✏️ 고치기</button> <button type="button" class="mini" data-nhide="${n.id}">빼기</button>`:""}</div>`).join("")}
    ${r.corrections?`<button type="button" class="mini" id="chg">🕘 정정 이력 ${r.corrections}건 보기</button><div id="chgl"></div>`:""}
  </div>
  <div class="panel"><h2>자료 덧붙이기</h2>
    <div class="muted">원청에 올린 변경점·카톡·사진을 이 기록에 붙입니다. 잘못 붙인 건 '빼기'로 정정합니다(사유 남음).</div>
    ${IS_PC?`<div class="paste">💡 스크린샷 찍고 <b>Ctrl+V</b> (또는 파일 끌어놓기)</div>`:""}
    <label class="btn ghost" style="flex-direction:row;justify-content:center;align-items:center;color:var(--ink)">📷 사진·스크린샷 고르기<input type="file" id="df" accept="image/*" multiple class="vh"></label>
    <div id="dpm"></div><div class="thumbs" id="dth"></div>
    <label>메모 (조치 결과, 원청 회신 등)<textarea id="dn" maxlength="3000"></textarea></label>
    <div id="dm"></div><button class="btn" id="ds">덧붙이기 저장</button></div>`;
  fill($("#body"));window.scrollTo(0,0);
  $("#dback").onclick=()=>{pasteTarget=null;viewList();};
  // 본문 정정: 원문은 서버에 그대로 남고, 정정본이 화면에 보임
  if($("#tedit")) $("#tedit").onclick=()=>{$("#tbox").innerHTML=`<label>정정할 내용<textarea id="tt" maxlength="5000">${esc(r.raw_text)}</textarea></label>
      <label>유형<select id="tc">${KINDS.map(k=>`<option value="${esc(k.v)}" ${k.v===r.event_category?"selected":""}>${k.label}</option>`).join("")}</select></label>
      <label>정정 사유<input id="tr" placeholder="예) 수치 오기, 원청 회신으로 원인 확정"></label>
      <div class="row"><button type="button" class="btn" id="tsave">정정 저장</button><button type="button" class="btn ghost" id="tcancel">취소</button></div><div id="tm"></div>`;
    $("#tcancel").onclick=()=>viewDetail(r,reload);
    $("#tsave").onclick=async()=>{const rs=$("#tr").value.trim();if(rs.length<2) return msg($("#tm"),"err","정정 사유를 적어주세요");
      try{await rpc("qms_history_correct",{p:{action:"text",event_id:r.id,text:$("#tt").value,event_category:$("#tc").value,reason:rs}});await refresh("본문 정정 완료 (원래 내용은 정정 이력에 남음)");}catch(e){msg($("#tm"),"err",e.message);}};};
  $("#body").onclick=async e=>{const b=e.target.closest("button[data-hide],button[data-nhide],button[data-nedit],button[data-restore]");if(!b)return;
    try{
      if(b.dataset.hide){const rs=ask("이 자료를 화면에서 뺍니다.");if(!rs)return;await rpc("qms_history_correct",{p:{action:"hide_media",path:b.dataset.hide,reason:rs}});await refresh("자료를 뺐습니다 (정정 이력에 남음)");}
      else if(b.dataset.restore){const rs=ask("뺀 자료를 다시 보이게 합니다.");if(!rs)return;await rpc("qms_history_correct",{p:{action:"restore_media",path:b.dataset.restore,reason:rs}});await refresh("자료를 복원했습니다");}
      else if(b.dataset.nhide){const rs=ask("이 메모를 화면에서 뺍니다.");if(!rs)return;await rpc("qms_history_correct",{p:{action:"hide_note",note_id:+b.dataset.nhide,reason:rs}});await refresh("메모를 뺐습니다");}
      else if(b.dataset.nedit){const box=b.closest(".note");const old=box.querySelector(".nt").textContent;
        box.innerHTML=`<label>고친 메모<textarea class="ne" maxlength="3000">${esc(old)}</textarea></label><label>정정 사유<input class="nr"></label><div class="row"><button type="button" class="btn ns">저장</button><button type="button" class="btn ghost nc">취소</button></div><div class="nm"></div>`;
        box.querySelector(".nc").onclick=()=>viewDetail(r,reload);
        box.querySelector(".ns").onclick=async()=>{const rs=box.querySelector(".nr").value.trim();if(rs.length<2) return msg(box.querySelector(".nm"),"err","정정 사유를 적어주세요");
          try{await rpc("qms_history_correct",{p:{action:"edit_note",note_id:+b.dataset.nedit,note:box.querySelector(".ne").value,reason:rs}});await refresh("메모 정정 완료");}catch(err){msg(box.querySelector(".nm"),"err",err.message);}};}
    }catch(err){msg($("#dm0"),"err",err.message);}};
  if($("#chg")) $("#chg").onclick=async()=>{try{const L=await rpc("qms_history_changes",{p_event_id:r.id});
    $("#chgl").innerHTML=L.map(x=>`<div class="note"><div class="muted">${esc(x.kind)} · ${esc(x.by)} · ${fmt(x.at)} · 사유: ${esc(x.reason)}</div>
      ${x.before?`<div><span class="muted">원래:</span> <s>${esc(x.before)}</s></div>`:""}${x.after?`<div><span class="muted">정정:</span> ${esc(x.after)}</div>`:""}
      ${x.path?`<img data-path="${esc(x.path)}" alt="" style="max-width:160px;opacity:.6">${me.role==="admin"?` <button type="button" class="mini" data-restore="${esc(x.path)}">복원</button>`:""}`:""}</div>`).join("");fill($("#chgl"));}
    catch(e){msg($("#chgl"),"err",e.message);}};
  const draw=()=>{$("#dth").innerHTML=add.map((p,i)=>`<div class="t"><img src="${p.url}" alt=""><button type="button" data-i="${i}">×</button></div>`).join("");};
  $("#dth").onclick=e=>{const b=e.target.closest("button[data-i]");if(!b)return;const [p]=add.splice(+b.dataset.i,1);URL.revokeObjectURL(p.url);draw();};
  pasteTarget=async fs=>{fs=fs.slice(0,MAX_FILES-add.length);msg($("#dpm"),"info","사진 처리 중…");let bad="";for(const f of fs){try{const b=await shrink(f,2560,.9);add.push({blob:b,url:URL.createObjectURL(b),type:b.type||"image/jpeg"});}catch(err){bad=err.message;}}draw();msg($("#dpm"),bad?"err":"ok",bad||`${add.length}장 붙음 — [덧붙이기 저장]을 누르세요`);};
  $("#df").onchange=e=>{const fs=[...e.target.files];e.target.value="";pasteTarget(fs);};
  $("#ds").onclick=async()=>{const note=$("#dn").value.trim();if(!add.length&&!note) return msg($("#dm"),"err","사진이나 메모를 넣으세요");
    const b=$("#ds");b.disabled=true;
    try{const uid=jwtSub();const paths=[];
      for(let i=0;i<add.length;i++){b.textContent=`올리는 중 ${i+1}/${add.length}`;const ty=add[i].type||"image/jpeg";const ext={"image/png":"png","image/webp":"webp"}[ty]||"jpg";const p=`${uid}/sf/${r.id}/${Date.now()}_m${i+1}.${ext}`;await upload(p,add[i].blob,ty);paths.push(p);}
      await rpc("qms_history_attach",{p_event_id:r.id,p_paths:paths,p_note:note||null});
      add.forEach(p=>URL.revokeObjectURL(p.url));pasteTarget=null;await refresh("덧붙이기 저장 완료");}
    catch(err){msg($("#dm"),"err","저장 실패: "+err.message);b.disabled=false;b.textContent="덧붙이기 저장";}};
}
$("#staff").onclick=viewStaff;
/* 주간 백업(원칙): 대표가 매주 1회 PC에 전체 데이터를 받아 회사 보관. 받은 기록은 서버 backup_log(pc)에 남아 주간 메일 점검에 쓰임. 사진·음성 파일은 포함 안 됨 */
$("#bk").onclick=async()=>{const b=$("#bk");b.disabled=true;b.textContent="백업 중…";
  try{const d=await rpc("qms_backup_export");let total=0;const n=Object.keys(d.tables).length;for(const v of Object.values(d.tables)) total+=v.length;
    const fn=`엠솔루션_데이터센터_백업_${ymd(new Date())}.json`;
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"}));a.download=fn;document.body.appendChild(a);a.click();a.remove();
    await rpc("qms_backup_log_write",{p_kind:"pc",p_ok:true,p_detail:`${fn} · ${n}개 표 · ${total}행`});
    alert(`백업 파일을 받았습니다.\n${fn}\n${n}개 표 · ${total.toLocaleString("ko-KR")}행\n\n회사 PC의 백업 폴더(또는 외장하드)에 보관하세요.`);}
  catch(e){alert("백업 실패: "+e.message);try{await rpc("qms_backup_log_write",{p_kind:"pc",p_ok:false,p_detail:e.message});}catch(e2){}}
  b.disabled=false;b.textContent="💾 백업";};
const ROLE_KO={admin:"대표",production:"생관",quality:"품질",materials:"자재"};
async function viewStaff(){
  $("#app").innerHTML=`<div class="panel"><h2>직원 계정</h2>
    <div class="row"><label>이름<input id="sn" placeholder="예) 홍길동"></label>
    <label>권한<select id="sr"><option value="production">생관 (현장 관리자)</option><option value="quality">품질</option><option value="materials">자재</option></select></label></div>
    <button class="btn" id="sb">등록 → 초기 비밀번호 받기</button><div id="sm"></div></div>
    <div class="panel"><h2>등록된 직원</h2><div id="sl" class="muted">불러오는 중…</div></div>
    <button class="btn ghost" id="back">← 이력장으로</button>`;
  $("#back").onclick=render;
  const big=(name,pw)=>`<div class="msg ok" style="font-size:16px"><b>${esc(name)}</b> 등록 완료<br>로그인: 이름 <b>${esc(name)}</b> · 초기 비밀번호 <b style="font-size:22px;letter-spacing:.08em">${esc(pw)}</b><br><span class="muted">이 비밀번호는 지금만 보입니다. 직원에게 전달하세요. 첫 로그인 때 본인이 바꿉니다.</span></div>`;
  const list=async()=>{try{const {users}=await staff({action:"list"},true);
    $("#sl").innerHTML=users.map(u=>`<div class="item" style="border-left-color:${u.active?"var(--ok)":"#bbb"}"><div class="hd"><b style="color:var(--fg);font-size:15px">${esc(u.name||u.login)}</b> · ${ROLE_KO[u.role]||u.role} · ${u.active?"사용":"정지"} · ${u.must_change?'<span class="pill etc">첫 로그인 전</span>':(u.last_sign_in_at?"최근 "+fmt(u.last_sign_in_at):"")}</div>
      ${u.role!=="admin"?`<div class="row"><button class="btn ghost" data-r="${u.user_id}" data-n="${esc(u.name||u.login)}">비밀번호 초기화</button><button class="btn ghost" data-a="${u.user_id}" data-v="${u.active?0:1}">${u.active?"사용 정지":"다시 사용"}</button></div>`:""}</div>`).join("");}
    catch(e){msg($("#sl"),"err",e.message);}};
  $("#sl").onclick=async e=>{const b=e.target.closest("button");if(!b)return;b.disabled=true;
    try{if(b.dataset.r){const j=await staff({action:"reset",user_id:b.dataset.r},true);$("#sm").innerHTML=big(b.dataset.n,j.init_password);window.scrollTo(0,0);}
      else{await staff({action:"set_active",user_id:b.dataset.a,active:b.dataset.v==="1"},true);}list();}catch(err){msg($("#sm"),"err",err.message);b.disabled=false;}};
  $("#sb").onclick=async()=>{const n=$("#sn").value.trim();if(n.length<2) return msg($("#sm"),"err","이름을 넣으세요");$("#sb").disabled=true;
    try{const j=await staff({action:"create",name:n,role:$("#sr").value},true);$("#sm").innerHTML=big(j.name,j.init_password);$("#sn").value="";list();}
    catch(err){msg($("#sm"),"err",err.message);}$("#sb").disabled=false;};
  list();
}
boot();
