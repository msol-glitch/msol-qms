<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://ettopqmqnjzktdfygtuz.supabase.co; img-src 'self' data: blob:; media-src blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#123B2F">
<title>차종 이력장 · 엠솔루션</title>
<style>
/* 차종 이력장 (시험본 v0.4, 2026-11-17) — QMS와 같은 서버·같은 로그인·같은 기록표(qms.shopfloor_events)를 쓴다. 새 DB 표 없음. */
:root{--ink:#123B2F;--ink2:#1B4A3C;--brass:#B49A5E;--paper:#F7F5EF;--rule:#E4E2DA;--fg:#18201D;--muted:#66706B;
  --ok:#2F6B4F;--ok-soft:#E5EFE8;--ng:#9E2B25;--ng-soft:#F6E6E3;--wait:#8A6420;--wait-soft:#F4ECDC;--test:#4B4F8C;--test-soft:#E9E9F2;
  --sans:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.55 var(--sans);color:var(--fg);background:var(--paper);padding-bottom:40px}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;border-bottom:3px solid var(--brass);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.hb{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hb b{font-size:17px}.hb small{display:block;font-size:12px;color:#A8B2AD}
.hb .sp{flex:1}
.hb button{background:transparent;color:#D9DCD6;border:1px solid #4A5550;border-radius:4px;padding:7px 10px;font:inherit;font-size:12.5px}
main{max-width:880px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.panel{background:#fff;border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:2px;padding:14px;display:flex;flex-direction:column;gap:12px}
h2{font-size:16px;margin:0}
.lab{font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:15px;min-height:46px;padding:8px 14px;border:1px solid #C9C6B8;background:#fff;border-radius:4px;color:var(--fg)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kinds button{font:inherit;min-height:64px;border:1px solid #C9C6B8;background:#fff;border-radius:4px;text-align:left;padding:10px 12px}
.kinds button b{display:block;font-size:16px}.kinds button span{font-size:12px;color:var(--muted)}
.kinds button.on{background:var(--ink);border-color:var(--ink);color:#fff}.kinds button.on span{color:#C8D2CD}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.tabs button{font:inherit;font-weight:700;min-height:46px;border:0;background:#fff;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:#fff;border:1px solid #B9C4BE;border-radius:4px;padding:10px 12px;width:100%;min-height:46px}
textarea{min-height:120px;resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-weight:500;min-height:40px}
.check input{width:22px;height:22px;min-height:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:4px;padding:12px 16px;min-height:50px;background:var(--ink);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn.rec{background:var(--ng)}
.btn:disabled{opacity:.55}
.msg{padding:10px 12px;border-radius:4px;font-size:14px}.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.err{background:var(--ng-soft);color:var(--ng)}.msg.info{background:var(--wait-soft);color:var(--wait)}
.muted{color:var(--muted);font-size:13px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .t{position:relative}.thumbs img{width:72px;height:72px;object-fit:cover;border:1px solid var(--rule);border-radius:3px}
.thumbs .t button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ng);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--rule)}
.kpi{padding:8px 6px;text-align:center;border-right:1px solid var(--rule)}.kpi:last-child{border-right:0}
.kpi .k{font-size:11.5px;color:var(--muted)}.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi.hl{background:var(--ink);color:#fff}.kpi.hl .k{color:#A8B2AD}
.item{border:1px solid var(--rule);border-left:4px solid var(--brass);border-radius:2px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.item.불량{border-left-color:var(--ng)}.item.경험·노하우{border-left-color:var(--ok)}.item.변동점\(4M\){border-left-color:var(--wait)}
.item .hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.item .tx{white-space:pre-wrap;word-break:break-word;font-size:15px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:3px;padding:1px 7px}
.pill.불량{background:var(--ng-soft);color:var(--ng)}.pill.경험·노하우{background:var(--ok-soft);color:var(--ok)}.pill.변동점\(4M\){background:var(--wait-soft);color:var(--wait)}.pill.기타,.pill.etc{background:#EEE;color:#555}.pill.test{background:var(--test-soft);color:var(--test)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:99}#lightbox img{max-width:100%;max-height:100%}
.trial{background:#FFF7E6;border:1px dashed #E2B35A;color:#7A5410;padding:8px 12px;font-size:13px;border-radius:3px}
</style>
</head>
<body>
<header><div class="hb"><div><b>차종 이력장</b><small id="who">엠솔루션 · 시험본 v0.4</small></div><div class="sp"></div><button id="staff" hidden>직원 계정</button><button id="out" hidden>로그아웃</button></div></header>
<main id="app"></main>
<script>
"use strict";
/* 같은 서버·같은 공개키·같은 로그인 저장(qms_session)을 QMS(test.html/index.html)와 공유한다. */
const SB_URL="https://ettopqmqnjzktdfygtuz.supabase.co";
const SB_KEY="sb_publishable_2XOscbG2JvfZyCGKiwyj9g_8_4k5G-P";
const LOGIN_DOMAIN="msolution.local", BUCKET="quality-evidence";
/* 라인 코드는 QMS와 같은 이름(데이터 축적 원칙 ②·⑥). 밀링스코어링의 차종 귀속은 확인 필요. */
const VEH={"KA4":["KA4 G/BOX"],"CE1/CT1":["CE1/CT1 G/BOX"],"SV1":["SV1 G/BOX","SV1 UPR"],"GN7":["GN7 G/BOX"],"SP3k":["SP3k G/BOX","SP3k PAB융착","밀링스코어링"]};
const ALL_LINES=Object.values(VEH).flat();
const VEHS=[...Object.keys(VEH),"공통"];
/* 유형: 화면 이름 → 서버 저장값. 변경점은 QMS 기존 값 '변동점(4M)'을 그대로 쓴다(같은 것은 같은 이름). */
const KINDS=[
  {v:"불량",label:"불량 이력",d:"증상·원인·조치·업체"},
  {v:"경험·노하우",label:"경험·노하우",d:"머릿속에만 있는 요령·주의점"},
  {v:"변동점(4M)",label:"변경점",d:"사람·설비·자재·방법 바뀐 것"},
  {v:"기타",label:"기타",d:"분류가 애매하면 여기"}];
const KIND_KO=Object.fromEntries(KINDS.map(k=>[k.v,k.label]));
const AUDIO_EXT={"audio/webm":"webm","audio/mp4":"m4a","audio/aac":"aac","audio/ogg":"ogg","audio/mpeg":"mp3"};
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd=d=>{d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const fmt=v=>new Date(v).toLocaleString("ko-KR",{year:"2-digit",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
const msg=(el,t,x)=>{el.innerHTML=x?`<div class="msg ${t}">${esc(x)}</div>`:"";};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- 로그인 (QMS와 동일 방식) ---------- */
let session=null, me=null;
try{session=JSON.parse(store.get("qms_session")||"null");}catch(e){}
function saveSession(s){session=s;try{s?localStorage.setItem("qms_session",JSON.stringify(s)):localStorage.removeItem("qms_session");}catch(e){}}
async function authCall(g,body){
  const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=${g}`,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const m=j.error_description||j.msg||j.message||"";throw new Error(j.error_code==="invalid_credentials"||/invalid login/i.test(m)?"아이디 또는 비밀번호가 맞지 않습니다":(m||"로그인 실패"));}
  return {access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600)};
}
async function token(){
  if(!session) throw new Error("로그인이 필요합니다");
  if(session.expires_at-Date.now()/1000<60){try{saveSession(await authCall("refresh_token",{refresh_token:session.refresh_token}));}catch(e){saveSession(null);showLogin("로그인이 만료되었습니다. 다시 로그인하세요.");throw e;}}
  return session.access_token;
}
async function rpc(name,args={}){
  const tk=await token(); /* 로그인 만료는 여기서 따로 처리 — 인터넷 오류로 잘못 표시되지 않게 */
  let r;try{r=await fetch(`${SB_URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:`Bearer ${tk}`,"Content-Type":"application/json"},body:JSON.stringify(args)});}
  catch(e){throw new Error("서버에 연결할 수 없습니다. 인터넷(LTE) 연결을 확인하세요.");}
  const j=await r.json().catch(()=>null);
  if(!r.ok){const m=j?.message||`오류 ${r.status}`;throw new Error(m==="Unauthorized"?"이 기능을 쓸 권한이 없습니다 (관리자에게 권한 요청)":m);}
  return j;
}
async function upload(path,blob,type){
  const r=await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:`Bearer ${await token()}`,"Content-Type":type,"x-upsert":"false"},body:blob});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||`업로드 오류 ${r.status}`);}
}
const cache={};
async function fileUrl(p){if(cache[p])return cache[p];const r=await fetch(`${SB_URL}/storage/v1/object/authenticated/${BUCKET}/${p}`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${await token()}`}});if(!r.ok)throw new Error("열람 불가");return cache[p]=URL.createObjectURL(await r.blob());}
function shrink(file,max=1600,q=.8){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.naturalWidth,i.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(i.naturalWidth*s);c.height=Math.round(i.naturalHeight*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error("사진 변환 실패")),"image/jpeg",q);};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error("이 사진 형식은 열 수 없습니다: "+file.name));};i.src=u;});}

async function staff(body,auth){
  const h={apikey:SB_KEY,"Content-Type":"application/json"}; if(auth) h.Authorization=`Bearer ${await token()}`;
  let r;try{r=await fetch(`${SB_URL}/functions/v1/msol-staff`,{method:"POST",headers:h,body:JSON.stringify(body)});}catch(e){throw new Error("서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.");}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`오류 ${r.status}`);return j;
}
function showLogin(note){
  me=null;$("#out").hidden=true;
  $("#app").innerHTML=`<form class="panel" id="fl"><h2>로그인</h2><div id="lm">${note?`<div class="msg info">${esc(note)}</div>`:""}</div>
  <label>이름<input id="li" autocomplete="username" autocapitalize="none" placeholder="예) 홍길동" required></label>
  <label>비밀번호<input id="lp" type="password" autocomplete="current-password" required></label>
  <button class="btn" id="lb">들어가기</button>
  <div class="muted">처음이면 대표에게 받은 초기 비밀번호를 넣으세요. 들어가면 바로 본인 비밀번호로 바꿉니다.</div></form>`;
  $("#fl").onsubmit=async e=>{e.preventDefault();const b=$("#lb");b.disabled=true;msg($("#lm"),"","");
    try{const {email}=await staff({action:"lookup",q:$("#li").value.trim()});
      saveSession(await authCall("password",{email,password:$("#lp").value}));await boot();}
    catch(err){msg($("#lm"),"err",err.message);b.disabled=false;}};
}
function jwtMeta(){try{const b=atob(session.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"));return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))).user_metadata||{};}catch(e){return {};}}
function showChangePw(){
  $("#app").innerHTML=`<form class="panel" id="fc"><h2>내 비밀번호 정하기</h2><div class="muted">처음 들어오셨습니다. 앞으로 쓸 비밀번호를 정하세요 (8자 이상).</div>
  <label>새 비밀번호<input id="p1" type="password" autocomplete="new-password" minlength="8" required></label>
  <label>한 번 더<input id="p2" type="password" autocomplete="new-password" minlength="8" required></label>
  <div id="cm"></div><button class="btn" id="cb">저장하고 들어가기</button></form>`;
  $("#fc").onsubmit=async e=>{e.preventDefault();const cm=$("#cm"),p1=$("#p1").value;
    if(p1.length<8) return msg(cm,"err","8자 이상으로 정하세요");if(p1!==$("#p2").value) return msg(cm,"err","두 비밀번호가 다릅니다");
    if(/^ms\d{6}$/.test(p1)) return msg(cm,"err","초기 비밀번호와 다른 것으로 정하세요");
    $("#cb").disabled=true;
    try{const r=await fetch(`${SB_URL}/auth/v1/user`,{method:"PUT",headers:{apikey:SB_KEY,Authorization:`Bearer ${await token()}`,"Content-Type":"application/json"},body:JSON.stringify({password:p1,data:{must_change:false}})});
      const j=await r.json().catch(()=>({}));if(!r.ok) throw new Error(/weak|short|least/i.test(j.msg||j.message||"")?"비밀번호가 너무 쉽습니다. 다른 것으로 정하세요":(j.msg||j.message||"변경 실패"));
      saveSession(await authCall("refresh_token",{refresh_token:session.refresh_token}));await boot();}
    catch(err){msg(cm,"err",err.message);$("#cb").disabled=false;}};
}
$("#out").onclick=()=>{saveSession(null);showLogin();};

/* ---------- 상태 ---------- */
/* 주소 뒤 ?v=SP3k 로 열면 그 차종이 바로 선택됨 (라인 게시판 QR·바로가기용) */
const qv=new URLSearchParams(location.search).get("v");
let veh=VEHS.includes(qv)?qv:(VEHS.includes(store.get("hist_veh"))?store.get("hist_veh"):"KA4");
let tab="write";
async function boot(){
  if(!session) return showLogin();
  try{me=await rpc("qms_me");}catch(e){if(!session) return; return showLogin(e.message);}
  if(!me||!me.role) return showLogin("이 계정은 QMS 사용자 등록이 안 되어 있습니다. 관리자에게 요청하세요.");
  if(!["admin","quality","production"].includes(me.role)) return showLogin("이 계정 권한으로는 이력장을 쓸 수 없습니다.");
  if(jwtMeta().must_change) return showChangePw();
  $("#who").textContent=`${jwtMeta().name||(me.email||"").split("@")[0]} · 시험본 v0.4`;$("#out").hidden=false;$("#staff").hidden=me.role!=="admin";render();
}
function render(){
  $("#app").innerHTML=`<div class="trial">시험본입니다. 기록은 QMS 현장기록과 같은 곳에 쌓입니다. 시험 기간에는 '시험 기록'이 기본으로 켜져 있어 공식 집계에서 빠집니다.</div>
  <div class="panel" style="gap:8px"><div class="lab">차종</div><div class="chips" id="vc">${VEHS.map(v=>`<button type="button" data-v="${esc(v)}" class="${v===veh?"on":""}">${esc(v)}</button>`).join("")}</div></div>
  <div class="tabs"><button type="button" data-t="write" class="${tab==="write"?"on":""}">기록하기</button><button type="button" data-t="list" class="${tab==="list"?"on":""}">이력 보기</button></div>
  <div id="body"></div>`;
  $("#vc").onclick=e=>{const b=e.target.closest("button");if(!b)return;veh=b.dataset.v;store.set("hist_veh",veh);render();};
  document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;render();};
  tab==="write"?viewWrite():viewList();
}

/* ---------- 기록하기: 차종 → 유형 → 말하거나 쳐서 저장 ---------- */
function viewWrite(){
  const lines=veh==="공통"?ALL_LINES:VEH[veh];
  let kind=null, line=lines.includes(store.get("hist_line_"+veh))?store.get("hist_line_"+veh):lines[0], photos=[], audio=null, rec=null, timer=null;
  $("#body").innerHTML=`<form class="panel" id="fw">
    <div class="lab">유형 (하나만)</div>
    <div class="kinds" id="kd">${KINDS.map(k=>`<button type="button" data-v="${esc(k.v)}"><b>${k.label}</b><span>${k.d}</span></button>`).join("")}</div>
    <div class="lab">라인</div><div class="chips" id="ln">${lines.map(l=>`<button type="button" data-v="${esc(l)}" class="${l===line?"on":""}">${esc(l)}</button>`).join("")}</div>
    <label>내용 <span class="muted" style="font-weight:400">— 휴대폰 키보드의 🎤 버튼을 누르고 말하면 글자로 들어갑니다</span>
      <textarea id="tx" maxlength="4900" placeholder="예) 우측 클립부 긁힘 반복. 사출 지그 모서리 닿는 것 확인, 테이프 보강 후 재발 없음"></textarea></label>
    <label class="check"><input type="checkbox" id="past"> 예전 일을 옮겨 적기 (카톡·사진·기억)</label>
    <div class="row" id="pastbox" hidden>
      <label>그 일이 있었던 날<input type="date" id="pd" max="${ymd(new Date())}"></label>
      <label>어디서 옮겨 왔나<select id="ps"><option>카톡</option><option>사진</option><option>기억</option><option>기타 문서</option></select></label>
    </div>
    <div class="row">
      <label class="btn ghost" style="flex-direction:row;justify-content:center;align-items:center;color:var(--ink)">📷 사진 (최대 4장)<input type="file" id="pf" accept="image/*" multiple hidden></label>
      <button type="button" class="btn ghost" id="rb">🎤 녹음 파일로 남기기</button>
    </div>
    <div class="thumbs" id="th"></div><div id="au"></div>
    <label class="check"><input type="checkbox" id="tst" checked> 시험 기록 (공식 집계 제외)</label>
    <div id="wm"></div>
    <button class="btn" id="sv">저장</button>
  </form>`;
  $("#kd").onclick=e=>{const b=e.target.closest("button");if(!b)return;kind=b.dataset.v;[...$("#kd").children].forEach(x=>x.classList.toggle("on",x===b));};
  $("#ln").onclick=e=>{const b=e.target.closest("button");if(!b)return;line=b.dataset.v;store.set("hist_line_"+veh,line);[...$("#ln").children].forEach(x=>x.classList.toggle("on",x===b));};
  $("#past").onchange=e=>{$("#pastbox").hidden=!e.target.checked;};
  const drawTh=()=>{$("#th").innerHTML=photos.map((p,i)=>`<div class="t"><img src="${p.url}" alt="사진${i+1}"><button type="button" data-i="${i}" aria-label="삭제">×</button></div>`).join("");};
  $("#th").onclick=e=>{const b=e.target.closest("button[data-i]");if(!b)return;const [p]=photos.splice(+b.dataset.i,1);URL.revokeObjectURL(p.url);drawTh();};
  $("#pf").onchange=async e=>{const fs=[...e.target.files].slice(0,4-photos.length);e.target.value="";for(const f of fs){try{const b=await shrink(f);photos.push({blob:b,url:URL.createObjectURL(b)});}catch(err){msg($("#wm"),"err",err.message);}}drawTh();};
  const drawAu=()=>{$("#au").innerHTML=audio?`<div style="display:flex;gap:8px;align-items:center"><audio controls src="${audio.url}" style="flex:1"></audio><button type="button" class="btn ghost" id="ad">삭제</button></div>`:"";if(audio)$("#ad").onclick=()=>{URL.revokeObjectURL(audio.url);audio=null;drawAu();};};
  $("#rb").onclick=async()=>{const b=$("#rb");
    if(rec&&rec.state==="recording"){rec.stop();return;}
    if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder) return msg($("#wm"),"err","이 브라우저는 녹음을 지원하지 않습니다. 키보드 🎤로 말해서 글로 남겨주세요.");
    let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){return msg($("#wm"),"err","마이크 사용이 허용되지 않았습니다.");}
    const type=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac"].find(t=>MediaRecorder.isTypeSupported(t))||"";
    const ch=[];rec=new MediaRecorder(st,type?{mimeType:type,audioBitsPerSecond:32000}:undefined);const t0=Date.now();
    rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data);};
    rec.onstop=()=>{clearInterval(timer);st.getTracks().forEach(t=>t.stop());const mt=(rec.mimeType||type||"audio/webm").split(";")[0];if(audio)URL.revokeObjectURL(audio.url);const bl=new Blob(ch,{type:mt});audio={blob:bl,mime:mt,url:URL.createObjectURL(bl)};b.textContent="🎤 다시 녹음";b.classList.remove("rec");drawAu();};
    rec.start();b.classList.add("rec");timer=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);b.textContent=`⏹ 녹음 중 ${s}초 (누르면 끝)`;if(s>=60)rec.stop();},250);};
  $("#fw").onsubmit=async e=>{e.preventDefault();const wm=$("#wm");let text=$("#tx").value.trim();
    if(rec&&rec.state==="recording") return msg(wm,"err","녹음을 먼저 끝내세요");
    if(!kind) return msg(wm,"err","유형을 하나 고르세요");
    if(!photos.length&&!audio&&text.length<2) return msg(wm,"err","내용, 사진, 녹음 중 하나는 남겨주세요");
    let occurred=null;
    if($("#past").checked){const d=$("#pd").value;if(!d) return msg(wm,"err","그 일이 있었던 날을 넣어주세요");
      occurred=`${d}T09:00:00+09:00`; text=`[옮김:${$("#ps").value}] `+text;}
    const b=$("#sv");b.disabled=true;b.textContent="저장 중…";let id=null;
    try{
      const r=await rpc("qms_field_report_create",{p:{line_name:line,vehicle:veh==="공통"?null:veh,event_category:kind,raw_text:text,occurred_at:occurred,
        has_photo:photos.length>0,has_audio:!!audio,record_kind:$("#tst").checked?"TEST":"NORMAL"}});
      id=r.id;const paths=[];
      for(let i=0;i<photos.length;i++){b.textContent=`사진 올리는 중 ${i+1}/${photos.length}`;const p=`${r.uid}/sf/${id}/${Date.now()}_${i+1}.jpg`;await upload(p,photos[i].blob,"image/jpeg");paths.push(p);}
      if(audio){b.textContent="음성 올리는 중";const p=`${r.uid}/sf/${id}/${Date.now()}_voice.${AUDIO_EXT[audio.mime]||"webm"}`;await upload(p,audio.blob,audio.mime);paths.push(p);}
      if(paths.length) await rpc("qms_field_report_attach",{p_event_id:id,p_paths:paths});
      photos.forEach(p=>URL.revokeObjectURL(p.url));if(audio)URL.revokeObjectURL(audio.url);
      viewWrite();msg($("#wm"),"ok",`저장 #${id} · ${veh} · ${KIND_KO[kind]} · ${line}${paths.length?` · 첨부 ${paths.length}`:""}`);
    }catch(err){msg(wm,"err",id?`기록 #${id}은 저장됐지만 첨부 실패: ${err.message}`:"저장 실패: "+err.message);b.disabled=false;b.textContent="저장";}
  };
}

/* ---------- 이력 보기: 차종별 누적 타임라인 ---------- */
function viewList(){
  let kf="", rows=[];
  $("#body").innerHTML=`<div class="panel">
    <div class="row"><label>기간<select id="per"><option value="90">최근 3개월</option><option value="365" selected>최근 1년</option><option value="1825">최근 5년</option></select></label>
      <label>검색<input id="q" placeholder="단어로 찾기 (예: 긁힘, 지그)"></label></div>
    <label class="check"><input type="checkbox" id="it" checked> 시험 기록도 보기</label>
    <div class="kpis" id="kp"></div>
    <div class="chips" id="kf"><button type="button" data-v="" class="on">전체</button>${KINDS.map(k=>`<button type="button" data-v="${esc(k.v)}">${k.label}</button>`).join("")}</div>
    <div id="lm"></div><div id="ls" style="display:flex;flex-direction:column;gap:8px"></div></div>`;
  const mine=()=>true; /* 차종 거르기는 서버(qms_history_list)에서 */
  const draw=()=>{const q=$("#q").value.trim().toLowerCase();
    const base=rows.filter(mine);const cnt=k=>base.filter(r=>k?r.event_category===k:true).length;
    $("#kp").innerHTML=`<div class="kpi hl"><div class="k">${esc(veh)} 전체</div><div class="v">${cnt("").toLocaleString("ko-KR")}건</div></div>`+KINDS.map(k=>`<div class="kpi"><div class="k">${k.label}</div><div class="v">${cnt(k.v).toLocaleString("ko-KR")}</div></div>`).join("");
    const v=base.filter(r=>(!kf||r.event_category===kf)&&(!q||`${r.raw_text} ${r.line_name} ${r.supplier||""} ${r.defect_type||""}`.toLowerCase().includes(q)));
    $("#ls").innerHTML=v.length?v.map(r=>{const c=KIND_KO[r.event_category]?r.event_category:"etc";
      return `<div class="item ${esc(c)}"><div class="hd"><b>#${r.id}</b>${fmt(r.occurred_at)} · ${esc(r.line_name)} <span class="pill ${esc(c)}">${esc(KIND_KO[r.event_category]||r.event_category)}</span>${r.record_kind==="TEST"?'<span class="pill test">시험</span>':""} · ${esc(r.reporter)}</div>
      <div class="tx">${esc(r.raw_text)}</div>
      ${r.media.length?`<div class="thumbs">${r.media.map(m=>(m.mime||"").startsWith("audio")?`<audio controls data-path="${esc(m.path)}" style="width:100%"></audio>`:`<img data-path="${esc(m.path)}" alt="첨부">`).join("")}</div>`:""}</div>`;}).join(""):`<div class="muted">기록이 없습니다.</div>`;
    fill($("#ls"));};
  const load=async()=>{msg($("#lm"),"info","불러오는 중…");
    try{rows=await rpc("qms_history_list",{p_vehicle:veh==="공통"?null:veh,p_lines:veh==="공통"?null:VEH[veh],p_from:ymd(Date.now()-$("#per").value*864e5),p_to:ymd(new Date()),p_include_test:$("#it").checked,p_limit:1000});msg($("#lm"),"","");draw();}
    catch(e){msg($("#lm"),"err",e.message);}};
  $("#kf").onclick=e=>{const b=e.target.closest("button");if(!b)return;kf=b.dataset.v;[...$("#kf").children].forEach(x=>x.classList.toggle("on",x===b));draw();};
  $("#q").oninput=draw;$("#per").onchange=load;$("#it").onchange=load;load();
}
async function fill(host){
  for(const el of host.querySelectorAll("[data-path]")){try{el.src=await fileUrl(el.dataset.path);if(el.tagName==="IMG")el.onclick=()=>{const d=document.createElement("div");d.id="lightbox";d.innerHTML=`<img src="${el.src}" alt="">`;d.onclick=()=>d.remove();document.body.appendChild(d);};}catch(e){el.replaceWith(Object.assign(document.createElement("span"),{className:"muted",textContent:"열람 불가"}));}}
}
$("#staff").onclick=viewStaff;
const ROLE_KO={admin:"대표",production:"생관",quality:"품질",materials:"자재"};
async function viewStaff(){
  $("#app").innerHTML=`<div class="panel"><h2>직원 계정</h2>
    <div class="row"><label>이름<input id="sn" placeholder="예) 홍길동"></label>
    <label>권한<select id="sr"><option value="production">생관 (현장 관리자)</option><option value="quality">품질</option><option value="materials">자재</option></select></label></div>
    <button class="btn" id="sb">등록 → 초기 비밀번호 받기</button><div id="sm"></div></div>
    <div class="panel"><h2>등록된 직원</h2><div id="sl" class="muted">불러오는 중…</div></div>
    <button class="btn ghost" id="back">← 이력장으로</button>`;
  $("#back").onclick=render;
  const big=(name,pw)=>`<div class="msg ok" style="font-size:16px"><b>${esc(name)}</b> 등록 완료<br>로그인: 이름 <b>${esc(name)}</b> · 초기 비밀번호 <b style="font-size:22px;letter-spacing:.08em">${esc(pw)}</b><br><span class="muted">이 비밀번호는 지금만 보입니다. 직원에게 전달하세요. 첫 로그인 때 본인이 바꿉니다.</span></div>`;
  const list=async()=>{try{const {users}=await staff({action:"list"},true);
    $("#sl").innerHTML=users.map(u=>`<div class="item" style="border-left-color:${u.active?"var(--ok)":"#bbb"}"><div class="hd"><b style="color:var(--fg);font-size:15px">${esc(u.name||u.login)}</b> · ${ROLE_KO[u.role]||u.role} · ${u.active?"사용":"정지"} · ${u.must_change?'<span class="pill etc">첫 로그인 전</span>':(u.last_sign_in_at?"최근 "+fmt(u.last_sign_in_at):"")}</div>
      ${u.role!=="admin"?`<div class="row"><button class="btn ghost" data-r="${u.user_id}" data-n="${esc(u.name||u.login)}">비밀번호 초기화</button><button class="btn ghost" data-a="${u.user_id}" data-v="${u.active?0:1}">${u.active?"사용 정지":"다시 사용"}</button></div>`:""}</div>`).join("");}
    catch(e){msg($("#sl"),"err",e.message);}};
  $("#sl").onclick=async e=>{const b=e.target.closest("button");if(!b)return;b.disabled=true;
    try{if(b.dataset.r){const j=await staff({action:"reset",user_id:b.dataset.r},true);$("#sm").innerHTML=big(b.dataset.n,j.init_password);window.scrollTo(0,0);}
      else{await staff({action:"set_active",user_id:b.dataset.a,active:b.dataset.v==="1"},true);}list();}catch(err){msg($("#sm"),"err",err.message);b.disabled=false;}};
  $("#sb").onclick=async()=>{const n=$("#sn").value.trim();if(n.length<2) return msg($("#sm"),"err","이름을 넣으세요");$("#sb").disabled=true;
    try{const j=await staff({action:"create",name:n,role:$("#sr").value},true);$("#sm").innerHTML=big(j.name,j.init_password);$("#sn").value="";list();}
    catch(err){msg($("#sm"),"err",err.message);}$("#sb").disabled=false;};
  list();
}
boot();
</script>
