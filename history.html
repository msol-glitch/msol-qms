<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://ettopqmqnjzktdfygtuz.supabase.co; img-src 'self' data: blob:; media-src blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">

<title>㈜엠솔루션 이력관리 데이터센터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* 차종 이력장 (시험본 v0.4, 2026-11-17) — QMS와 같은 서버·같은 로그인·같은 기록표(qms.shopfloor_events)를 쓴다. 새 DB 표 없음. */
:root{--ink:#123B2F;--ink2:#1B4A3C;--brass:#B49A5E;--paper:#F7F5EF;--rule:#E4E2DA;--fg:#18201D;--muted:#66706B;
  --ok:#2F6B4F;--ok-soft:#E5EFE8;--ng:#9E2B25;--ng-soft:#F6E6E3;--wait:#8A6420;--wait-soft:#F4ECDC;--test:#4B4F8C;--test-soft:#E9E9F2;
  --sans:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.55 var(--sans);color:var(--fg);background:var(--paper);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:20;background:#fff;color:var(--ink);padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 var(--rule),0 4px 12px rgba(18,59,47,.06)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{height:22px;width:auto}.brand b{font-size:16px;letter-spacing:-.02em;color:var(--ink);white-space:nowrap;padding-left:10px;border-left:1px solid var(--rule)}
.hb{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px}


.hb .sp{flex:1}
.hb>button,.xbtn{background:#fff;color:var(--ink);border:1px solid #C9C6B8;border-radius:4px;padding:7px 10px;font:inherit;font-size:12.5px}
main{max-width:880px;margin:0 auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.panel{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font-size:16px;margin:0}
.lab{font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:14.5px;min-height:40px;padding:6px 14px;border:1px solid var(--rule);background:#fff;border-radius:8px;color:var(--fg)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kinds button{font:inherit;min-height:58px;border:1px solid var(--rule);background:#fff;border-radius:10px;text-align:left;padding:10px 12px}
.kinds button b{display:block;font-size:15px}.kinds button span{display:block;font-size:11.5px;line-height:1.35;color:var(--muted);margin-top:3px}
.kinds button.on{background:var(--ink);border-color:var(--ink);color:#fff}.kinds button.on span{color:#C8D2CD}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.tabs button{font:inherit;font-weight:700;min-height:46px;border:0;background:#fff;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:#fff;border:1px solid #B9C4BE;border-radius:4px;padding:10px 12px;width:100%;min-height:46px}
textarea{min-height:120px;resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-weight:500;min-height:40px}
.check input{width:22px;height:22px;min-height:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;min-height:50px;background:var(--ink);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn.rec{background:var(--ng)}
.btn:disabled{opacity:.55}
.msg{padding:10px 12px;border-radius:4px;font-size:14px}.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.err{background:var(--ng-soft);color:var(--ng)}.msg.info{background:var(--wait-soft);color:var(--wait)}
.muted{color:var(--muted);font-size:13px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .t{position:relative}.thumbs img{width:72px;height:72px;object-fit:cover;border:1px solid var(--rule);border-radius:3px}
.thumbs .t button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ng);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--rule)}
.kpi{padding:8px 6px;text-align:center;border-right:1px solid var(--rule)}.kpi:last-child{border-right:0}
.kpi .k{font-size:11.5px;color:var(--muted)}.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi.hl{background:var(--ink);color:#fff}.kpi.hl .k{color:#A8B2AD}
.item{border:1px solid var(--rule);border-left:4px solid var(--brass);border-radius:2px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.item.불량{border-left-color:var(--ng)}.item.경험·노하우{border-left-color:var(--ok)}.item.변동점\(4M\){border-left-color:var(--wait)}
.item .hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.item .tx{white-space:pre-wrap;word-break:break-word;font-size:15px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:3px;padding:1px 7px}
.pill.불량{background:var(--ng-soft);color:var(--ng)}.pill.경험·노하우{background:var(--ok-soft);color:var(--ok)}.pill.변동점\(4M\){background:var(--wait-soft);color:var(--wait)}.pill.기타,.pill.etc{background:#EEE;color:#555}.pill.test{background:var(--test-soft);color:var(--test)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:99}#lightbox img{max-width:100%;max-height:100%}
.heic{width:72px;height:72px;display:flex;align-items:center;justify-content:center;text-align:center;background:#E9E6DC;border:1px solid var(--rule);border-radius:3px;font-size:12px;font-weight:700;color:var(--muted);line-height:1.3}
.big-heic{width:100%;height:auto;padding:16px;text-decoration:none;color:var(--ink)}
input.pastday{background:#FFF7E6;border-color:#E2B35A;font-weight:700}
.att{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.abtn{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;border:1px dashed #B9C4BE;border-radius:10px;background:#FBFAF6;color:var(--ink);font-size:22px;cursor:pointer;position:relative}.abtn span{font-size:12.5px;font-weight:600}.abtn.rec{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.click{cursor:pointer}.click:hover{background:#FAF8F2}.tx.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.big{display:flex;flex-direction:column;gap:10px}.big img{width:100%;height:auto;border:1px solid var(--rule);border-radius:3px;cursor:zoom-in}
.mini{font:inherit;font-size:13px;border:1px solid #C9C6B8;background:#fff;border-radius:3px;padding:5px 10px;color:var(--ink);cursor:pointer;margin-top:4px}.mwrap{display:flex;flex-direction:column;gap:4px}
.note{background:#F4F1E8;border-radius:3px;padding:8px 10px;white-space:pre-wrap}
.paste{background:#EEF4F0;border:1px dashed var(--ok);color:var(--ink);padding:8px 12px;border-radius:3px;font-size:13.5px}
@media(min-width:900px){main,.hb{max-width:1180px}}
.tw{overflow-x:auto;border:1px solid var(--rule)}.ht{border-collapse:collapse;width:100%;font-size:14px}
.ht th{background:var(--ink);color:#fff;text-align:left;padding:10px;font-weight:600;white-space:nowrap}.ht th.n,.ht td.n{text-align:right}
.ht td{padding:10px;border-top:1px solid var(--rule);white-space:nowrap}.ht td.ell{max-width:420px;overflow:hidden;text-overflow:ellipsis}
.ht tbody tr{cursor:pointer}.ht tbody tr:nth-child(even) td{background:#FAF9F5}.ht tbody tr:hover td{background:#EEF4F0}.mono{font-variant-numeric:tabular-nums;color:var(--muted)}
.who{font-size:12.5px;color:var(--muted);white-space:nowrap}
.menu{position:relative}#mbtn{width:36px;height:36px;border:1px solid var(--rule);border-radius:50%;background:#fff;font-size:18px;line-height:1;color:var(--ink);cursor:pointer}
.mlist{position:absolute;right:0;top:42px;background:#fff;border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:160px;padding:6px;display:flex;flex-direction:column;z-index:30}
.mlist button{font:inherit;text-align:left;border:0;background:none;padding:11px 12px;border-radius:6px;color:var(--fg);cursor:pointer}.mlist button:hover{background:var(--paper)}
.vbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:0 10px 10px;max-width:880px;margin:0 auto}.vbar::-webkit-scrollbar{display:none}
.vbar button{font:inherit;font-size:13px;font-weight:700;padding:8px 0;border-radius:8px;white-space:nowrap;letter-spacing:-.02em;border:1px solid var(--rule);background:#fff;color:var(--muted);cursor:pointer}
.vbar button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 12px rgba(0,0,0,.04)}
.bnav button{font:inherit;border:0;background:none;padding:8px 4px 9px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;cursor:pointer}
.bnav button i{font-style:normal;font-size:20px;line-height:1.1}.bnav button.on{color:var(--ink);font-weight:700}.bnav button.on i{transform:scale(1.08)}
@media(min-width:900px){.bnav{left:50%;right:auto;transform:translateX(-50%);width:520px;border:1px solid var(--rule);border-bottom:0;border-radius:14px 14px 0 0}}
.sec{display:flex;flex-direction:column;gap:8px}.sec+.sec{border-top:1px dashed var(--rule);padding-top:14px}
.st{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink)}.st em{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11.5px;display:grid;place-items:center}
.st small{font-weight:400;color:var(--muted);font-size:12px}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;font:inherit;font-size:13.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--rule);background:#fff;color:var(--fg);cursor:pointer}
.fchips button b{margin-left:4px;font-variant-numeric:tabular-nums}.fchips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fchips button.warn{border-color:#E2B35A;background:#FFF7E6;color:#7A5410}.fchips button.warn.on{background:#B7791F;border-color:#B7791F;color:#fff}
.card{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--brass);border-radius:10px;padding:12px 12px 10px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.card.불량{border-left-color:var(--ng)}.card.경험·노하우{border-left-color:var(--ok)}.card.변동점\(4M\){border-left-color:var(--wait)}.card.un{border-left-color:#E2B35A;background:#FFFCF5}
.ctop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cdate{font-size:13px;font-weight:700;color:var(--fg)}.cflag{font-size:11.5px;color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:0 5px}
.cbody{display:flex;gap:10px;align-items:flex-start}.cbody .tx{flex:1;font-size:15px}.cimg{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--rule);flex:none}
.cfoot{font-size:12.5px;color:var(--muted);display:flex;align-items:center}.chev{margin-left:auto;font-size:20px;color:#B9C4BE;line-height:1}
.pill.un{background:#FFF1D6;color:#8A5A00}
#ln.chips button{min-height:36px;font-size:13.5px;padding:5px 12px}
.sg:empty{display:none}.sgrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#F3F7F4;border:1px solid #D5E3DA;border-radius:8px;padding:8px 10px}.sgw{font-size:12px}
.lk{font-size:12.5px;color:#4B5E8C;margin-top:2px}
.rchip{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:4px 6px 4px 12px;font-size:13.5px}.rchip button{border:0;background:#E3DFD3;border-radius:50%;width:20px;height:20px;cursor:pointer;color:var(--muted)}
.trial{background:#FFF7E6;border:1px dashed #E2B35A;color:#7A5410;padding:8px 12px;font-size:13px;border-radius:3px}
</style>
</head>

const KINDS=[
  {v:"불량",label:"불량 이력",d:"불량 증상·원인·조치, 협력사 불량, 고객 클레임"},

/* ---------- 분류 추천: 서버 규칙표(단어 → 항목·4M)로 내용에서 추천. 사람이 눌러야 확정(자동 저장 안 함) ---------- */
let RULES=[];
async function loadRules(){try{RULES=await rpc("qms_history_rules");}catch(e){RULES=[];}}
function suggest(text){const t=(text||"").toLowerCase();if(t.length<2||!RULES.length)return null;
  const sc={},hit={};for(const r of RULES){if(t.includes(r.w.toLowerCase())){const k=r.c+"|"+(r.m||"");sc[k]=(sc[k]||0)+1;(hit[r.c]=hit[r.c]||[]).push(r.w.trim());}}
  const cat={};for(const k in sc){const c=k.split("|")[0];cat[c]=(cat[c]||0)+sc[k];}
  const order=["불량","변동점(4M)","경험·노하우","기타"];const best=order.filter(c=>cat[c]).sort((a,b)=>cat[b]-cat[a]||order.indexOf(a)-order.indexOf(b))[0];
  if(!best)return null;
  const topM=c=>Object.keys(sc).filter(k=>k.startsWith(c+"|")).sort((a,b)=>sc[b]-sc[a])[0]?.split("|")[1]||null;
  const m=best==="변동점(4M)"?topM(best):null;
  let link=null;if(best==="불량"&&cat["변동점(4M)"])link={c:"변동점(4M)",m:topM("변동점(4M)")};else if(best==="변동점(4M)"&&cat["불량"])link={c:"불량",m:null};
  return {c:best,m,link,words:[...new Set(hit[best]||[])]};}
const sgName=x=>(KIND_KO[x.c]||x.c)+(x.m?` · ${x.m}`:"");
/* 한 기록에 불량·변경점이 같이 보이면 '연계 가능' 작은 표시(저장 구조는 그대로) */
function linkHint(r){const s=suggest(r.raw_text);if(!s)return "";const t=(r.raw_text||"").toLowerCase();
  const has=c=>RULES.some(x=>x.c===c&&t.includes(x.w.toLowerCase()));
  if(r.event_category==="불량"&&has("변동점(4M)"))return "🔗 변경점 연계 가능";
  if(r.event_category==="변동점(4M)"&&has("불량"))return "🔗 불량 이력 연계 가능";return "";}
function sgHTML(s){if(!s)return "";return `<div class="sgrow"><span class="muted">추천</span><b class="pill ${s.c==="불량"?"불량":s.c==="변동점(4M)"?"변동점(4M)":s.c==="경험·노하우"?"경험·노하우":"etc"}">${esc(sgName(s))}</b><button type="button" class="mini sgapply">적용</button>${s.words.length?`<span class="muted sgw">${esc(s.words.slice(0,3).join("·"))}</span>`:""}</div>${s.link?`<div class="lk">🔗 연계 가능: ${esc(sgName(s.link))}</div>`:""}`;}
const kindName=r=>(KIND_KO[r.event_category]||r.event_category)+(r.four_m?` · ${r.four_m}`:"");

let session=null, me=null;

function saveSession(s){session=s;try{s?localStorage.setItem("qms_session",JSON.stringify(s)):localStorage.removeItem("qms_session");}catch(e){}}
async function authCall(g,body){
  const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=${g}`,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const m=j.error_description||j.msg||j.message||"";throw new Error(j.error_code==="invalid_credentials"||/invalid login/i.test(m)?"아이디 또는 비밀번호가 맞지 않습니다":(m||"로그인 실패"));}
  return {access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600)};
}
async function token(){
  if(!session) throw new Error("로그인이 필요합니다");
  if(session.expires_at-Date.now()/1000<60){try{saveSession(await authCall("refresh_token",{refresh_token:session.refresh_token}));}catch(e){saveSession(null);showLogin("로그인이 만료되었습니다. 다시 로그인하세요.");throw e;}}
  return session.access_token;
}
async function rpc(name,args={}){
  const tk=await token(); /* 로그인 만료는 여기서 따로 처리 — 인터넷 오류로 잘못 표시되지 않게 */
  let r;try{r=await fetch(`${SB_URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:`Bearer ${tk}`,"Content-Type":"application/json"},body:JSON.stringify(args)});}
  catch(e){throw new Error("서버에 연결할 수 없습니다. 인터넷(LTE) 연결을 확인하세요.");}
  const j=await r.json().catch(()=>null);
  if(!r.ok){const m=j?.message||`오류 ${r.status}`;throw new Error(m==="Unauthorized"?"이 기능을 쓸 권한이 없습니다 (관리자에게 권한 요청)":m);}
  return j;
}
async function upload(path,blob,type){
  const r=await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:`Bearer ${await token()}`,"Content-Type":type,"x-upsert":"false"},body:blob});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||`업로드 오류 ${r.status}`);}
}
const cache={};
async function fileUrl(p){if(cache[p])return cache[p];const r=await fetch(`${SB_URL}/storage/v1/object/authenticated/${BUCKET}/${p}`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${await token()}`}});if(!r.ok)throw new Error("열람 불가");return cache[p]=URL.createObjectURL(await r.blob());}
/* 사진 줄이기: 큰 폰 사진(5천만 화소 등)도 되도록 ① createImageBitmap ② Image ③ 원본 그대로(10MB 이하 JPG·PNG·WEBP) 순서로 시도 */
const OK_TYPES=["image/jpeg","image/png","image/webp","image/heic","image/heif"];
const isHeic=t=>/heic|heif/i.test(t||"");
function fixType(f){if(f.type)return f;const m=/\.(heic|heif)$/i.exec(f.name||"");return m?new File([f],f.name,{type:"image/"+m[1].toLowerCase()}):f;}
/* HEIC(삼성·아이폰 고효율 사진)는 브라우저가 못 줄임 → 원본 그대로 보관(증빙 유지). 미리보기 대신 'HEIC 사진' 칸 + 내려받기 */
const thumb=p=>isHeic(p.type)?`<div class="heic">HEIC<br>사진</div>`:`<img src="${p.url}" alt="">`;
function toJpeg(src,w,h,max,q){const s=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);return new Promise((ok,no)=>c.toBlob(b=>b&&b.size>0?ok(b):no(new Error("변환 실패")),"image/jpeg",q));}
async function shrink(file,max=1600,q=.8){
  file=fixType(file);
  if(window.createImageBitmap){try{const bm=await createImageBitmap(file);try{return await toJpeg(bm,bm.width,bm.height,max,q);}finally{bm.close&&bm.close();}}catch(e){}}
  try{return await new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{toJpeg(i,i.naturalWidth,i.naturalHeight,max,q).then(ok,no).finally(()=>URL.revokeObjectURL(u));};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error("열 수 없음"));};i.src=u;});}catch(e){}
  if(OK_TYPES.includes(file.type)&&file.size<=10*1024*1024) return file;
  throw new Error(`이 사진은 올릴 수 없습니다 (${file.type||"형식 모름"}, ${(file.size/1048576).toFixed(1)}MB, 10MB 이하만 가능). [📷 촬영] 버튼으로 바로 찍거나 화면 캡처로 올려주세요.`);
}

function jwtSub(){try{return JSON.parse(atob(session.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).sub;}catch(e){return null;}}
/* PC: 스크린샷 찍고 Ctrl+V (또는 파일 끌어놓기) → 지금 화면의 첨부칸에 바로 들어감 */
let pasteTarget=null;
const imgFiles=list=>[...(list||[])].filter(f=>f&&/^image\//.test(f.type));
document.addEventListener("paste",e=>{if(!pasteTarget)return;const fs=imgFiles([...(e.clipboardData?.items||[])].map(i=>i.kind==="file"?i.getAsFile():null));if(fs.length){e.preventDefault();pasteTarget(fs);}});
document.addEventListener("dragover",e=>{if(pasteTarget)e.preventDefault();});
document.addEventListener("drop",e=>{if(!pasteTarget)return;e.preventDefault();const fs=imgFiles(e.dataTransfer?.files);if(fs.length)pasteTarget(fs);});

/* 날짜 읽는 순서: ① 사진 속 촬영일(EXIF, HEIC 포함) ② 파일 이름 ③ 파일 수정일. 오늘 날짜로 읽히면 ⚠ 확인 표시 */
async function photoDate(f){
  let r=null;
  // ① 사진 속 촬영 정보(EXIF, HEIC 포함) — 카톡에서 저장한 사진은 없을 수 있음
  try{const buf=new Uint8Array(await f.slice(0,524288).arrayBuffer());let txt="";for(let i=0;i<buf.length;i++)txt+=String.fromCharCode(buf[i]);
    const all=[...txt.matchAll(/(20\d{2}):(0[1-9]|1[0-2]):([0-2]\d|3[01]) ([01]\d|2[0-3]):([0-5]\d):([0-5]\d)/g)];
    if(all.length){const x=all.map(a=>a[0]).sort()[0].split(/[: ]/);r={d:`${x[0]}-${x[1]}-${x[2]}`,t:`${x[3]}:${x[4]}:${x[5]}`,src:"촬영 정보"};}}catch(e){}
  // ② 파일 이름(KakaoTalk_20241105…, Screenshot_20241105…, 20241105_123456) — 카톡 이름은 '저장한 날'일 수 있음
  if(!r){const m=/(20\d{2})[-_.]?(0[1-9]|1[0-2])[-_.]?([0-2]\d|3[01])(?:[-_ ]?([01]\d|2[0-3])[-_.]?([0-5]\d)[-_.]?([0-5]\d))?/.exec(f.name||"");
    if(m) r={d:`${m[1]}-${m[2]}-${m[3]}`,t:m[4]?`${m[4]}:${m[5]}:${m[6]||"00"}`:null,src:/kakao/i.test(f.name)?"카톡 파일 이름(저장한 날일 수 있음 — 확인 필요)":"파일 이름"};}
  // ③ 파일 날짜
  if(!r&&f.lastModified){const d=new Date(f.lastModified);r={d:ymd(d),t:d.toTimeString().slice(0,8),src:"파일 날짜(확인 필요)"};}
  if(!r) r={d:ymd(new Date()),t:null,src:"모름(확인 필요)"};
  if(r.d===ymd(new Date())&&!/확인/.test(r.src)) r.src+="(오늘 날짜 — 확인 필요)";
  return r;
}
function viewBulk(){
  const lines=veh==="공통"?ALL_LINES:VEH[veh];let items=[];
  $("#body").innerHTML=`<div class="panel">
    <h2>사진 한꺼번에 올리기 · ${esc(veh)}</h2>
    <div class="muted">휴대폰 앨범·카톡에 쌓인 예전 사진을 여러 장 한 번에 고르세요. <b>날짜는 사진에서 자동으로 읽고</b>, 분류는 나중에 [이력 보기 → ⚠ 미분류]에서 하나씩 하면 됩니다.</div>
    <div class="row"><label>라인<select id="bl">${lines.map(l=>`<option>${esc(l)}</option>`).join("")}</select></label>
      <label>어디서 가져왔나요?<select id="bs"><option>사진</option><option>카톡</option><option>기타 문서</option></select></label></div>
    <label class="check"><input type="checkbox" id="bg" checked> 같은 날 사진은 한 기록으로 묶기</label>
    <label class="btn ghost" style="flex-direction:row;justify-content:center;align-items:center;color:var(--ink)">🖼 사진 여러 장 고르기<input type="file" id="bf" accept="image/*" multiple class="vh"></label>
    ${IS_PC?`<div class="paste">💡 PC: 폴더에서 사진 여러 장을 여기로 끌어놓아도 됩니다</div>`:""}
    <div id="bm"></div><div id="bv"></div></div>`;
  const groups=()=>{const g=new Map();for(const it of items){const k=$("#bg").checked?it.d:it.d+"#"+items.indexOf(it);if(!g.has(k))g.set(k,[]);g.get(k).push(it);}
    return [...g.values()].sort((a,b)=>a[0].d<b[0].d?-1:1);};
  const draw=()=>{const G=groups();
    $("#bv").innerHTML=items.length?`<div class="muted">사진 ${items.length}장 → 기록 <b>${G.length}건</b>으로 저장됩니다. 날짜가 틀리면 고치세요.</div>
      ${G.map((g,gi)=>`<div class="item" style="border-left-color:#E2B35A"><div class="row"><label>날짜<input type="date" data-g="${gi}" value="${g[0].d}" max="${ymd(new Date())}"></label>
        <label>메모 (선택)<input data-gm="${gi}" value="${esc(g[0].memo||"")}" placeholder="예) SP3k 클립 긁힘"></label></div>
        <div class="thumbs">${g.map(it=>`<div class="t">${thumb(it)}<button type="button" data-x="${items.indexOf(it)}">×</button></div>`).join("")}</div>
        <div class="muted">${[...new Set(g.map(it=>it.src))].join(", ")}에서 읽은 날짜${g.some(it=>/확인/.test(it.src))?" ⚠":""}</div></div>`).join("")}
      <button class="btn" id="bsave">기록 ${G.length}건 저장</button>`:"";
    $("#bv").querySelectorAll("input[data-g]").forEach(inp=>inp.onchange=()=>{groups()[+inp.dataset.g].forEach(it=>{it.d=inp.value;it.src="직접 입력";});draw();});
    $("#bv").querySelectorAll("input[data-gm]").forEach(inp=>inp.oninput=()=>{groups()[+inp.dataset.gm].forEach(it=>it.memo=inp.value);});
    const sv=$("#bsave");if(sv)sv.onclick=save;};
  $("#bv").onclick=e=>{const b=e.target.closest("button[data-x]");if(!b)return;const [it]=items.splice(+b.dataset.x,1);URL.revokeObjectURL(it.url);draw();};
  $("#bg").onchange=draw;
  const add=async fs=>{fs=fs.slice(0,200-items.length);msg($("#bm"),"info",`사진 ${fs.length}장 읽는 중…`);let bad=0,i=0;
    for(const f of fs){i++;if(i%5===0)msg($("#bm"),"info",`사진 읽는 중… ${i}/${fs.length}`);
      try{const dt=await photoDate(f);const b=await shrink(f,2560,.9);items.push({blob:b,url:URL.createObjectURL(b),type:b.type||"image/jpeg",d:dt.d,t:dt.t,src:dt.src,memo:""});}catch(e){bad++;}}
    msg($("#bm"),bad?"err":"ok",`${items.length}장 준비됨${bad?` · ${bad}장은 열 수 없어 뺐습니다(10MB 초과 등)`:""}`);draw();};
  pasteTarget=add;
  $("#bf").onchange=e=>{const fs=[...e.target.files];e.target.value="";add(fs);};
  const save=async()=>{const G=groups();const b=$("#bsave");b.disabled=true;const uid=jwtSub();let ok=0,fail=[];
    for(let gi=0;gi<G.length;gi++){const g=G[gi];b.textContent=`저장 중 ${gi+1}/${G.length}`;
      if(g[0].d>ymd(new Date())){fail.push(g[0].d+" (앞날짜)");continue;}
      const t0=g.map(x=>x.t).filter(Boolean).sort()[0];
      const memo=(g[0].memo||"").trim();
      try{const r=await rpc("qms_field_report_create",{p:{line_name:$("#bl").value,vehicle:veh==="공통"?null:veh,event_category:"미분류",
          raw_text:`[옮김:${$("#bs").value}] ${memo||"사진 기록"}`,occurred_at:`${g[0].d}T${t0||"09:00:00"}+09:00`,has_photo:true,record_kind:"NORMAL"}});
        for(let c=0;c<g.length;c+=30){const paths=[];
          for(let i=c;i<Math.min(c+30,g.length);i++){const it=g[i];const ext={"image/png":"png","image/webp":"webp","image/heic":"heic","image/heif":"heif"}[it.type]||"jpg";
            const p=`${uid}/sf/${r.id}/${Date.now()}_b${i+1}.${ext}`;await upload(p,it.blob,it.type);paths.push(p);}
          await rpc("qms_history_attach",{p_event_id:r.id,p_paths:paths});}
        ok++;}catch(e){fail.push(`${g[0].d}: ${e.message}`);}}
    items.forEach(it=>URL.revokeObjectURL(it.url));items=[];draw();
    msg($("#bm"),fail.length?"err":"ok",`기록 ${ok}건 저장 완료${fail.length?` · 실패 ${fail.length}건: ${fail.join(" / ")}`:""} → [이력 보기 → ⚠ 미분류]에서 분류하세요`);};
}

  $("#app").innerHTML=`<div class="panel"><h2>🏷 분류 추천 규칙</h2>
    <div class="muted">내용에 이 단어가 들어 있으면 그 분류를 추천합니다. 추천은 사람이 [적용]을 눌러야 확정됩니다. 현장에서 쓰는 표현을 계속 넣어 주세요.</div>

  $("#app").onclick=async e=>{const b=e.target.closest("button[data-rid]");if(!b)return;if(!confirm(`'${b.parentElement.firstChild.textContent}' 규칙을 뺄까요? (기록은 남습니다)`))return;
    try{await rpc("qms_history_rule_set",{p_word:"",p_category:"기타",p_retire_id:+b.dataset.rid});viewRules();}catch(err){alert(err.message);}};

/* 주간 백업(원칙): 대표가 매주 1회 PC에 전체 데이터를 받아 회사 보관. 받은 기록은 서버 backup_log(pc)에 남아 주간 메일 점검에 쓰임. 사진·음성 파일은 포함 안 됨 */
$("#bk").onclick=async()=>{$("#mlist").hidden=true;const b=$("#bk");b.disabled=true;b.textContent="백업 중…";
  try{const d=await rpc("qms_backup_export");let total=0;const n=Object.keys(d.tables).length;for(const v of Object.values(d.tables)) total+=v.length;
    const fn=`엠솔루션_데이터센터_백업_${ymd(new Date())}.json`;
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"}));a.download=fn;document.body.appendChild(a);a.click();a.remove();
    await rpc("qms_backup_log_write",{p_kind:"pc",p_ok:true,p_detail:`${fn} · ${n}개 표 · ${total}행`});
    alert(`백업 파일을 받았습니다.\n${fn}\n${n}개 표 · ${total.toLocaleString("ko-KR")}행\n\n회사 PC의 백업 폴더(또는 외장하드)에 보관하세요.`);}
  catch(e){alert("백업 실패: "+e.message);try{await rpc("qms_backup_log_write",{p_kind:"pc",p_ok:false,p_detail:e.message});}catch(e2){}}
  b.disabled=false;b.textContent="💾 백업 받기";};
const ROLE_KO={admin:"대표",production:"생관",quality:"품질",materials:"자재"};
async function viewStaff(){
  $("#app").innerHTML=`<div class="panel"><h2>직원 계정</h2>
    <div class="row"><label>이름<input id="sn" placeholder="예) 홍길동"></label>
    <label>권한<select id="sr"><option value="production">생관 (현장 관리자)</option><option value="quality">품질</option><option value="materials">자재</option></select></label></div>
    <button class="btn" id="sb">등록 → 초기 비밀번호 받기</button><div id="sm"></div></div>
    <div class="panel"><h2>등록된 직원</h2><div id="sl" class="muted">불러오는 중…</div></div>
    <button class="btn ghost" id="back">← 이력장으로</button>`;
  $("#back").onclick=render;
  const big=(name,pw)=>`<div class="msg ok" style="font-size:16px"><b>${esc(name)}</b> 등록 완료<br>로그인: 이름 <b>${esc(name)}</b> · 초기 비밀번호 <b style="font-size:22px;letter-spacing:.08em">${esc(pw)}</b><br><span class="muted">이 비밀번호는 지금만 보입니다. 직원에게 전달하세요. 첫 로그인 때 본인이 바꿉니다.</span></div>`;
  const list=async()=>{try{const {users}=await staff({action:"list"},true);
    $("#sl").innerHTML=users.map(u=>`<div class="item" style="border-left-color:${u.active?"var(--ok)":"#bbb"}"><div class="hd"><b style="color:var(--fg);font-size:15px">${esc(u.name||u.login)}</b> · ${ROLE_KO[u.role]||u.role} · ${u.active?"사용":"정지"} · ${u.must_change?'<span class="pill etc">첫 로그인 전</span>':(u.last_sign_in_at?"최근 "+fmt(u.last_sign_in_at):"")}</div>
      ${u.role!=="admin"?`<div class="row"><button class="btn ghost" data-r="${u.user_id}" data-n="${esc(u.name||u.login)}">비밀번호 초기화</button><button class="btn ghost" data-a="${u.user_id}" data-v="${u.active?0:1}">${u.active?"사용 정지":"다시 사용"}</button></div>`:""}</div>`).join("");}
    catch(e){msg($("#sl"),"err",e.message);}};
  $("#sl").onclick=async e=>{const b=e.target.closest("button");if(!b)return;b.disabled=true;
    try{if(b.dataset.r){const j=await staff({action:"reset",user_id:b.dataset.r},true);$("#sm").innerHTML=big(b.dataset.n,j.init_password);window.scrollTo(0,0);}
      else{await staff({action:"set_active",user_id:b.dataset.a,active:b.dataset.v==="1"},true);}list();}catch(err){msg($("#sm"),"err",err.message);b.disabled=false;}};
  $("#sb").onclick=async()=>{const n=$("#sn").value.trim();if(n.length<2) return msg($("#sm"),"err","이름을 넣으세요");$("#sb").disabled=true;
    try{const j=await staff({action:"create",name:n,role:$("#sr").value},true);$("#sm").innerHTML=big(j.name,j.init_password);$("#sn").value="";list();}
    catch(err){msg($("#sm"),"err",err.message);}$("#sb").disabled=false;};
  list();
}
